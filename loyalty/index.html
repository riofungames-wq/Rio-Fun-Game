<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Rio Maggi Point - Loyalty Card
</title>


<link rel="manifest" href="manifest.json">


<meta name="theme-color" content="#f5d99b">


<link rel="icon" href="favicon.ico">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



<style>


:root{

--primary-bg:#f5d99b;

--card-bg:#fff8e7;

--accent-color:#d19b4a;

--text-dark:#3a2e2b;

--text-muted:#7a6855;

--border-color:#e0be7b;

--btn-red:#c62828;

}



*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}



body{

background:var(--primary-bg);

color:var(--text-dark);

min-height:100vh;

display:flex;

flex-direction:column;

align-items:center;

padding-bottom:90px;

}



.container{

width:100%;

max-width:420px;

padding:20px;

}



/* HEADER */


.header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}



.header h2{

font-size:1.3rem;

font-weight:700;

}



.logout-btn{

background:rgba(209,155,74,.2);

border:1px solid var(--border-color);

color:var(--text-dark);

padding:8px 14px;

border-radius:12px;

cursor:pointer;

font-weight:600;

}



/* CARD */


.loyalty-card{

background:var(--card-bg);

border:3px solid var(--accent-color);

border-radius:20px;

padding:20px;

box-shadow:0 10px 25px rgba(0,0,0,.1);

}



.profile-section{

display:flex;

align-items:center;

gap:15px;

margin-bottom:20px;

}



.avatar-box{

width:60px;

height:60px;

border-radius:50%;

background:#fff7df;

border:2px solid var(--accent-color);

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

overflow:hidden;

}



.avatar-box img{

width:100%;

height:100%;

object-fit:cover;

}



.user-info h3{

font-size:1.1rem;

font-weight:700;

}



.user-info p{

font-size:.85rem;

color:var(--text-muted);

}



/* STAMPS */


.stamp-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

margin-top:15px;

}



.stamp-box{

aspect-ratio:1;

background:#fff;

border:2px dashed var(--accent-color);

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:1.2rem;

font-weight:bold;

color:var(--accent-color);

}



.stamp-box.active{

background:var(--btn-red);

border:2px solid var(--btn-red);

color:white;

}
    <!-- BODY START -->

</style>

</head>


<body>


<div class="container">


<header class="header">


<h2>
🍜 Rio Maggi Point
</h2>


<button 
class="logout-btn"
id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>
Logout

</button>


</header>





<div class="loyalty-card">



<div class="profile-section">


<div class="avatar-box">


<span id="emojiAvatar">

😊

</span>


<img 
id="imageAvatar"
style="display:none;"
alt="Profile">


</div>




<div class="user-info">


<h3 id="userName">

Loading...

</h3>


<p id="userEmail">

Loading...

</p>


</div>


</div>





<div 
class="stamp-grid"
id="stampContainer">


</div>



</div>


</div>





<!-- BOTTOM NAVIGATION -->


<nav class="bottom-nav">


<a 
class="nav-item active"
href="index.html">


<i class="fa-solid fa-house"></i>


<span>
Home
</span>


</a>





<a 
class="nav-item"
href="qr.html">


<i class="fa-solid fa-qrcode"></i>


<span>
QR
</span>


</a>





<a 
class="nav-item"
href="history.html">


<i class="fa-solid fa-clock-rotate-left"></i>


<span>
History
</span>


</a>





<a 
class="nav-item"
href="profile.html">


<i class="fa-solid fa-user"></i>


<span>
Profile
</span>


</a>



</nav>
    <style>

/* BOTTOM NAVIGATION */

.bottom-nav{

position:fixed;

bottom:0;

left:50%;

transform:translateX(-50%);

width:100%;

max-width:420px;

background:#263525;

border-top:2px solid var(--accent-color);

display:flex;

justify-content:space-around;

padding:12px 0;

z-index:1000;

}



.nav-item{

color:#ffd54f;

text-decoration:none;

display:flex;

flex-direction:column;

align-items:center;

font-size:.75rem;

gap:4px;

font-weight:600;

opacity:.7;

}



.nav-item i{

font-size:1.2rem;

}



.nav-item.active,

.nav-item:hover{

opacity:1;

color:white;

}



</style>




<!-- FIREBASE SCRIPT -->


<script type="module">


import { firebaseConfig } from "./firebase-config.js";


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import { 
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {

getFirestore,
doc,
getDoc

}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";





const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);





const userName = document.getElementById("userName");

const userEmail = document.getElementById("userEmail");

const emojiAvatar = document.getElementById("emojiAvatar");

const imageAvatar = document.getElementById("imageAvatar");

const stampContainer = document.getElementById("stampContainer");

const logoutBtn = document.getElementById("logoutBtn");





onAuthStateChanged(auth, async(user)=>{


if(!user){


window.location.href="login.html";

return;


}





try{


const docRef = doc(db,"customers",user.uid);


const docSnap = await getDoc(docRef);



console.log(
"UID:",
user.uid
);



console.log(
"Customer Exists:",
docSnap.exists()
);





if(docSnap.exists()){



const data = docSnap.data();



userName.textContent =
data.name || "Customer";



userEmail.textContent =
data.email || user.email;



if(data.photoURL){


imageAvatar.src=data.photoURL;


imageAvatar.style.display="block";


emojiAvatar.style.display="none";


}

else if(data.avatar){


emojiAvatar.textContent=data.avatar;


}



renderStamps(
data.stamps || 0
);



}

else{


userName.textContent="Welcome Customer";


userEmail.textContent=user.email || "";



renderStamps(0);



}





}

catch(error){


console.error(
"Firebase Error:",
error
);



userName.textContent="Error Loading";


}



});






function renderStamps(count){


stampContainer.innerHTML="";



for(let i=1;i<=6;i++){


const stamp=document.createElement("div");



stamp.className =
"stamp-box " +
(i<=count ? "active":"");



stamp.innerHTML =
i<=count
?
'<i class="fa-solid fa-check"></i>'
:
i;



stampContainer.appendChild(stamp);



}



}






logoutBtn.addEventListener("click",()=>{


signOut(auth)
.then(()=>{


window.location.href="login.html";


});


});



</script>


</body>

</html>
