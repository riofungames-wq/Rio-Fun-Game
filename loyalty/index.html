<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Rio Maggi Point - Home
    </title>


    <!-- =====================================================
         PWA
         ===================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#f5d99b"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link
        rel="icon"
        href="favicon.ico"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >


    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- =====================================================
         COMMON CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="common.css"
    >


    <!-- =====================================================
         HOME PAGE CSS
         ===================================================== -->

    <style>

        /* =================================================
           HOME PAGE ONLY
           ================================================= */


        body {

            background:
                #f5d99b;

        }


        /* =================================================
           HOME CONTAINER
           ================================================= */

        .home-page {

            width: 100%;

            max-width: 420px;

            min-height:
                calc(100vh - 72px);

            margin:
                0 auto;

            padding:
                20px
                20px
                30px;

        }


        /* =================================================
           TOP HEADER
           ================================================= */

        .home-header {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 20px;

        }


        .home-brand {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;

        }


        .home-brand-icon {

            width: 46px;

            height: 46px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                #263525;

            color:
                #ffd54f;

            font-size: 22px;

        }


        .home-brand-text {

            min-width: 0;

        }


        .home-brand-text h1 {

            font-size: 18px;

            line-height: 1.2;

            font-weight: 800;

            color:
                #3a2e2b;

        }


        .home-brand-text p {

            margin-top: 3px;

            font-size: 11px;

            color:
                #7a6855;

        }


        /* =================================================
           PROFILE BUTTON
           ================================================= */

        .home-profile-btn {

            width: 44px;

            height: 44px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #fff8e7;

            border:
                2px solid
                #d19b4a;

            color:
                #3a2e2b;

            text-decoration:
                none;

        }


        .home-profile-btn i {

            font-size: 19px;

        }


        /* =================================================
           WELCOME CARD
           ================================================= */

        .welcome-card {

            width: 100%;

            padding: 20px;

            margin-bottom: 18px;

            background:
                #263525;

            color:
                white;

            border-radius: 18px;

            box-shadow:
                0 8px 22px
                rgba(0,0,0,.12);

        }


        .welcome-card h2 {

            font-size: 21px;

            line-height: 1.3;

            margin-bottom: 6px;

            color:
                #ffd54f;

        }


        .welcome-card p {

            font-size: 13px;

            line-height: 1.6;

            color:
                #f5f5f5;

        }


        /* =================================================
           LOYALTY SUMMARY
           ================================================= */

        .loyalty-summary {

            width: 100%;

            padding: 18px;

            margin-bottom: 18px;

            background:
                #fff8e7;

            border:
                2px solid
                #d19b4a;

            border-radius: 16px;

        }


        .loyalty-summary-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 15px;

        }


        .loyalty-summary-header h3 {

            font-size: 17px;

            color:
                #3a2e2b;

        }


        .stamp-count-label {

            font-size: 13px;

            font-weight: 600;

            color:
                #c62828;

        }


        /* =================================================
           STAMP GRID
           ================================================= */

        .home-stamp-grid {

            display: grid;

            grid-template-columns:
                repeat(6, 1fr);

            gap: 7px;

        }


        .home-stamp {

            width: 100%;

            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #fff;

            border:
                2px solid
                #d19b4a;

            color:
                #7a6855;

            font-size: 12px;

            font-weight: 700;

        }


        .home-stamp.active {

            background:
                #c62828;

            border-color:
                #c62828;

            color:
                #fff;

        }


        /* =================================================
           QUICK ACTIONS
           ================================================= */

        .quick-actions {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 18px;

        }


        .quick-action {

            min-height: 100px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 15px;

            background:
                #fff8e7;

            border:
                2px solid
                #e0be7b;

            border-radius: 16px;

            color:
                #3a2e2b;

            text-decoration:
                none;

        }


        .quick-action i {

            font-size: 24px;

            color:
                #c62828;

        }


        .quick-action span {

            font-size: 12px;

            font-weight: 600;

            text-align: center;

        }

    </style>

</head>


<body>

    <!-- =====================================================
         HOME PAGE
         ===================================================== -->

    <main class="home-page">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="home-header">

            <div class="home-brand">

                <div class="home-brand-icon">

                    <i class="fa-solid fa-bowl-food"></i>

                </div>


                <div class="home-brand-text">

                    <h1>
                        Rio Maggi Point
                    </h1>

                    <p>
                        Premium Loyalty Club
                    </p>

                </div>

            </div>


            <a
                href="profile.html"
                class="home-profile-btn"
                aria-label="Profile"
            >

                <i class="fa-solid fa-user"></i>

            </a>

        </header>


        <!-- =================================================
             WELCOME
             ================================================= -->

        <section class="welcome-card">

            <h2 id="welcomeTitle">
                Welcome!
            </h2>

            <p id="welcomeSubtitle">
                Welcome to Rio Maggi Point Premium Loyalty Club.
            </p>

        </section>


        <!-- =================================================
             LOYALTY SUMMARY
             ================================================= -->

        <section class="loyalty-summary">

            <div class="loyalty-summary-header">

                <h3>
                    Loyalty Summary
                </h3>


                <span
                    class="stamp-count-label"
                    id="stampCountLabel"
                >
                    ⭐ 0/6 Stamps
                </span>

            </div>


            <div
                class="home-stamp-grid"
                id="homeStampGrid"
            >

                <!-- JavaScript will create 6 stamps -->

            </div>

        </section>


        <!-- =================================================
             QUICK ACTIONS
             ================================================= -->

        <section class="quick-actions">


            <a
                href="qr.html"
                class="quick-action"
            >

                <i class="fa-solid fa-qrcode"></i>

                <span>
                    My QR Code
                </span>

            </a>


            <a
                href="history.html"
                class="quick-action"
            >

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span>
                    Stamp History
                </span>

            </a>


            <a
                href="menu.html"
                class="quick-action"
            >

                <i class="fa-solid fa-utensils"></i>

                <span>
                    View Menu
                </span>

            </a>


            <a
                href="feedback.html"
                class="quick-action"
            >

                <i class="fa-solid fa-star"></i>

                <span>
                    Give Feedback
                </span>

            </a>


        </section>


        <!-- =================================================
             PART 2 WILL CONTINUE HERE
             ================================================= -->

    </main>
        <!-- =====================================================
         BOTTOM NAVIGATION
         FIXED MASTER LAYOUT
         SAME SIZE ON EVERY PAGE
         ===================================================== -->

    <nav
        class="bottom-nav"
        aria-label="Main Navigation"
    >


        <a
            href="index.html"
            class="nav-item active"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                Home
            </span>

        </a>


        <a
            href="qr.html"
            class="nav-item"
        >

            <i class="fa-solid fa-qrcode"></i>

            <span>
                QR
            </span>

        </a>


        <a
            href="history.html"
            class="nav-item"
        >

            <i class="fa-solid fa-clock-rotate-left"></i>

            <span>
                History
            </span>

        </a>


        <a
            href="profile.html"
            class="nav-item"
        >

            <i class="fa-solid fa-user"></i>

            <span>
                Profile
            </span>

        </a>


    </nav>


    <!-- =====================================================
         FIREBASE
         ===================================================== -->

    <script type="module">


        import {
            firebaseConfig
        }
        from "./js/firebase-config.js";


        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


        /* =================================================
           FIREBASE INITIALIZE
           ================================================= */


        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(
                app
            );


        const db =
            getFirestore(
                app
            );


        /* =================================================
           HTML ELEMENTS
           ================================================= */


        const welcomeTitle =
            document.getElementById(
                "welcomeTitle"
            );


        const welcomeSubtitle =
            document.getElementById(
                "welcomeSubtitle"
            );


        const stampCountLabel =
            document.getElementById(
                "stampCountLabel"
            );


        const homeStampGrid =
            document.getElementById(
                "homeStampGrid"
            );


        /* =================================================
           AUTH CHECK
           ================================================= */


        onAuthStateChanged(

            auth,

            async (user) => {


                /* -----------------------------------------
                   USER NOT LOGGED IN
                   ----------------------------------------- */


                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                /* -----------------------------------------
                   DEFAULT USER NAME
                   ----------------------------------------- */


                welcomeTitle.textContent =
                    "Welcome!";


                welcomeSubtitle.textContent =
                    "Welcome to Rio Maggi Point Premium Loyalty Club.";


                /* -----------------------------------------
                   LOAD CUSTOMER DATA
                   ----------------------------------------- */


                try {


                    const userRef =
                        doc(
                            db,
                            "customers",
                            user.uid
                        );


                    const userSnap =
                        await getDoc(
                            userRef
                        );


                    /* -------------------------------------
                       CUSTOMER FOUND
                       ------------------------------------- */


                    if (
                        userSnap.exists()
                    ) {


                        const data =
                            userSnap.data();


                        const customerName =
                            data.name ||
                            "Customer";


                        const stamps =
                            Number(
                                data.stamps || 0
                            );


                        /* ---------------------------------
                           WELCOME NAME
                           --------------------------------- */


                        welcomeTitle.textContent =
                            "Welcome, " +
                            customerName +
                            "!";


                        welcomeSubtitle.textContent =
                            "Enjoy your Rio Maggi Point Loyalty Rewards.";


                        /* ---------------------------------
                           STAMP COUNT
                           --------------------------------- */


                        const safeStamps =
                            Math.min(
                                Math.max(
                                    stamps,
                                    0
                                ),
                                6
                            );


                        stampCountLabel.textContent =
                            "⭐ " +
                            safeStamps +
                            "/6 Stamps";


                        /* ---------------------------------
                           RENDER STAMPS
                           --------------------------------- */


                        renderHomeStamps(
                            safeStamps
                        );


                    }


                    /* -------------------------------------
                       CUSTOMER DOCUMENT NOT FOUND
                       ------------------------------------- */


                    else {


                        stampCountLabel.textContent =
                            "⭐ 0/6 Stamps";


                        renderHomeStamps(
                            0
                        );


                    }


                }


                /* -----------------------------------------
                   FIREBASE ERROR
                   ----------------------------------------- */


                catch (
                    error
                ) {


                    console.error(
                        "Home Firebase Error:",
                        error
                    );


                    stampCountLabel.textContent =
                        "⭐ 0/6 Stamps";


                    renderHomeStamps(
                        0
                    );


                }


            }

        );


        /* =================================================
           RENDER HOME STAMPS
           ================================================= */


        function renderHomeStamps(
            count
        ) {


            homeStampGrid.innerHTML =
                "";


            const safeCount =
                Math.min(
                    Math.max(
                        Number(count) || 0,
                        0
                    ),
                    6
                );


            for (
                let i = 1;
                i <= 6;
                i++
            ) {


                const stamp =
                    document.createElement(
                        "div"
                    );


                stamp.className =
                    "home-stamp";


                /* -----------------------------------------
                   ACTIVE STAMP
                   ----------------------------------------- */


                if (
                    i <= safeCount
                ) {


                    stamp.classList.add(
                        "active"
                    );


                    stamp.innerHTML =
                        '<i class="fa-solid fa-check"></i>';


                }


                /* -----------------------------------------
                   EMPTY STAMP
                   ----------------------------------------- */


                else {


                    stamp.textContent =
                        i;


                }


                homeStampGrid.appendChild(
                    stamp
                );


            }


        }


        /* =================================================
           SERVICE WORKER
           ================================================= */


        if (
            "serviceWorker"
            in navigator
        ) {


            window.addEventListener(

                "load",

                () => {


                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .catch(

                            (error) => {


                                console.error(
                                    "Service Worker Error:",
                                    error
                                );


                            }

                        );


                }

            );


        }


        /* =================================================
           STARTUP
           ================================================= */


        console.log(
            "================================="
        );


        console.log(
            "RIO MAGGI POINT HOME"
        );


        console.log(
            "HOME PAGE READY"
        );


        console.log(
            "FIREBASE USER LOADING READY"
        );


        console.log(
            "LOYALTY STAMP DISPLAY READY"
        );


        console.log(
            "MASTER BOTTOM NAVIGATION READY"
        );


        console.log(
            "================================="
        );


    </script>
        <!-- =====================================================
         FINAL PAGE END
         ===================================================== -->


</body>


</html>
