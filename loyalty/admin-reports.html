<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Rio Maggi Point | Reports

</title>

<link rel="manifest" href="manifest.json">

<link rel="icon" href="favicon.ico">

<link
rel="stylesheet"
href="css/admin-reports.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================================= -->
<!-- HEADER -->
<!-- ================================= -->

<header class="topBar">

<div class="leftHeader">

<a
href="admin-dashboard.html"
class="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<div>

<h1>

<i class="fa-solid fa-chart-line"></i>

Reports Dashboard

</h1>

<p>

Rio Maggi Point Analytics

</p>

</div>

</div>

<button id="refreshBtn">

<i class="fa-solid fa-rotate"></i>

Refresh

</button>

</header>

<!-- ================================= -->
<!-- STATS -->
<!-- ================================= -->

<div class="container">

<div class="statsGrid">

<div class="statCard">

<h2 id="todayScan">

0

</h2>

<p>

Today's Scan

</p>

</div>

<div class="statCard">

<h2 id="weekScan">

0

</h2>

<p>

Weekly Scan

</p>

</div>

<div class="statCard">

<h2 id="monthScan">

0

</h2>

<p>

Monthly Scan

</p>

</div>

<div class="statCard">

<h2 id="rewardClaim">

0

</h2>

<p>

Rewards Claimed

</p>

</div>

</div>

<div class="card">

<h2>

<i class="fa-solid fa-calendar-days"></i>

Report Filter

</h2>

<div class="filterGrid">

<input
id="fromDate"
type="date">

<input
id="toDate"
type="date">

<button id="loadReport">

Load Report

</button>

</div>

</div>
  <!-- ================================= -->
<!-- REPORT TABLE -->
<!-- ================================= -->

<div class="card">

<h2>

<i class="fa-solid fa-table"></i>

Report Details

</h2>

<div class="tableCard">

<table>

<thead>

<tr>

<th>Date</th>

<th>Customer</th>

<th>Member ID</th>

<th>Stamp</th>

<th>Reward</th>

</tr>

</thead>

<tbody id="reportTable">

<tr>

<td colspan="5">

No Report Loaded

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- ================================= -->
<!-- SUMMARY -->
<!-- ================================= -->

<div class="card">

<h2>

<i class="fa-solid fa-chart-pie"></i>

Summary

</h2>

<div class="summaryGrid">

<div>

<h3 id="summaryCustomer">

0

</h3>

<p>

Customers

</p>

</div>

<div>

<h3 id="summaryStamp">

0

</h3>

<p>

Total Stamps

</p>

</div>

<div>

<h3 id="summaryReward">

0

</h3>

<p>

Rewards

</p>

</div>

</div>

</div>

</div>

<!-- ================================= -->
<!-- FOOTER -->
<!-- ================================= -->

<footer class="footer">

Rio Maggi Point Reports Dashboard

</footer>

<!-- ================================= -->
<!-- SCRIPT -->
<!-- ================================= -->

<script
type="module"
src="js/admin-reports.js">

</script>

</body>
</html>
