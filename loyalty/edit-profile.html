<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Edit Profile

</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/edit-profile.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<!-- =============================== -->
<!-- HEADER -->
<!-- =============================== -->

<header class="edit-header">

<h1>

<i class="fa-solid fa-user-pen"></i>

Edit Profile

</h1>

<p>

Update Your Information

</p>

</header>

<!-- =============================== -->
<!-- PROFILE PHOTO -->
<!-- =============================== -->

<section class="photo-section">

<div class="photo-box">

<img

id="editPhoto"

src="assets/avatars/default.png"

alt="Customer">

</div>

<input

type="file"

id="photoInput"

accept="image/*">

</section>

<!-- =============================== -->
<!-- FORM -->
<!-- =============================== -->

<form id="editProfileForm">

<div class="form-group">

<label>

Full Name

</label>

<input

type="text"

id="editName"

required>

</div>

<div class="form-group">

<label>

Mobile Number

</label>

<input

type="tel"

id="editMobile"

maxlength="10">

</div>

<div class="form-group">

<label>

Email

</label>

<input

type="email"

id="editEmail"

disabled>

</div>

<div class="form-group">

<label>

Member ID

</label>

<input

type="text"

id="editMemberId"

disabled>

</div>

<div class="form-group">

<label>

Date Of Birth

</label>

<input

type="date"

id="editDOB">

</div>

<div class="form-group">

<label>

Gender

</label>

<select id="editGender">

<option value="male">

Male

</option>

<option value="female">

Female

</option>

</select>

</div>
  <!-- =============================== -->
<!-- ACTION BUTTONS -->
<!-- =============================== -->

<div class="button-row">

<button
type="submit"
id="saveProfileBtn"
class="primary-btn">

<i class="fa-solid fa-floppy-disk"></i>

Save Changes

</button>

<button
type="button"
id="cancelBtn"
class="secondary-btn">

<i class="fa-solid fa-arrow-left"></i>

Cancel

</button>

</div>

</form>

<!-- =============================== -->
<!-- MEMBER INFO -->
<!-- =============================== -->

<section class="member-info">

<div class="info-card">

<h3>

🔒 Permanent Member ID

</h3>

<p>

Your Member ID and QR Code are permanent and cannot be changed.

</p>

</div>

</section>

<!-- =============================== -->
<!-- BOTTOM NAVIGATION -->
<!-- =============================== -->

<nav class="bottom-nav">

<a href="card.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>QR</span>

</a>

<a href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>History</span>

</a>

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>Review</span>

</a>

<a
href="profile.html"
class="active">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>

</div>

<!-- =============================== -->
<!-- EDIT PROFILE JS -->
<!-- =============================== -->

<script
type="module"
src="js/edit-profile.js"></script>

</body>
</html>
