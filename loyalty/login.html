<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point | Customer Login</title>

<meta name="theme-color" content="#C89B3C">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="assets/logo/logo.png">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}


body{

min-height:100vh;

background:
linear-gradient(135deg,#fff8ea,#f7d88b);

display:flex;

justify-content:center;

align-items:center;

padding:30px;

overflow:hidden;

}


body::before{

content:"";

position:fixed;

width:700px;
height:700px;

border-radius:50%;

background:rgba(255,255,255,.18);

top:-250px;

right:-250px;

filter:blur(40px);

}


body::after{

content:"";

position:fixed;

width:500px;
height:500px;

border-radius:50%;

background:rgba(212,175,55,.18);

left:-180px;

bottom:-180px;

filter:blur(40px);

}



.login-card{

position:relative;

width:100%;

max-width:430px;

background:#fff;

border-radius:28px;

padding:40px 34px;

box-shadow:

0 20px 55px rgba(0,0,0,.15);

z-index:5;

}



.logo{

display:flex;

justify-content:center;

margin-bottom:18px;

}


.logo img{

width:95px;

height:95px;

object-fit:contain;

}



.title{

text-align:center;

font-size:30px;

font-weight:800;

color:#4d3200;

margin-bottom:8px;

}



.subtitle{

text-align:center;

font-size:14px;

color:#7d6b45;

margin-bottom:35px;

}



.form-group{

margin-bottom:22px;

}



.form-group label{

display:block;

font-size:14px;

font-weight:600;

margin-bottom:8px;

color:#5d4b25;

}



.input-box{

position:relative;

}


.input-box i{

position:absolute;

left:16px;

top:50%;

transform:translateY(-50%);

color:#C89B3C;

font-size:18px;

}



.input-box input{

width:100%;

height:56px;

border:2px solid #ead7a3;

border-radius:15px;

padding-left:50px;

padding-right:50px;

font-size:15px;

outline:none;

transition:.25s;

}


.input-box input:focus{

border-color:#C89B3C;

box-shadow:0 0 0 4px rgba(200,155,60,.15);

}


.password-toggle{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#777;

font-size:18px;

}
  .forgot-box{

text-align:right;

margin-bottom:28px;

}


.forgot{

text-decoration:none;

color:#b8860b;

font-weight:600;

}


.forgot:hover{

text-decoration:underline;

}



.login-btn{

width:100%;

height:58px;

border:none;

border-radius:16px;

background:

linear-gradient(135deg,#d4af37,#b8860b);

color:#fff;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.25s;

box-shadow:

0 10px 25px rgba(184,134,11,.35);

}



.login-btn:hover{

transform:translateY(-2px);

}



.login-btn:disabled{

opacity:.7;

cursor:not-allowed;

}



.signup{

text-align:center;

margin-top:28px;

font-size:15px;

color:#666;

}



.signup a{

color:#b8860b;

font-weight:700;

text-decoration:none;

}



.signup a:hover{

text-decoration:underline;

}



.footer{

margin-top:28px;

text-align:center;

font-size:12px;

color:#999;

}



@media(max-width:480px){


.login-card{

padding:30px 22px;

border-radius:22px;

}


.title{

font-size:26px;

}


.subtitle{

font-size:13px;

}


}


</style>

</head>


<body>


<div class="login-card">


<div class="logo">


<img

src="assets/logo/logo.png"

alt="Rio Logo">


</div>



<h1 class="title">

Rio Maggi Point

</h1>



<p class="subtitle">

Customer Loyalty Login

</p>




<form id="loginForm">


<!-- EMAIL -->


<div class="form-group">


<label>

Email Address

</label>



<div class="input-box">


<i class="fa-solid fa-envelope"></i>


<input

type="email"

id="email"

placeholder="Enter your email"

autocomplete="email"

required>


</div>


</div>





<!-- PASSWORD -->


<div class="form-group">


<label>

Password

</label>



<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="password"

placeholder="Enter your password"

autocomplete="current-password"

required>



<span

class="password-toggle"

id="togglePassword">


<i class="fa-solid fa-eye"></i>


</span>


</div>


</div>





<!-- FORGOT PASSWORD -->


<div class="forgot-box">


<a

href="#"

id="forgotPassword"

class="forgot">


Forgot Password?

</a>


</div>





<!-- LOGIN BUTTON -->


<button

type="submit"

id="loginBtn"

class="login-btn">


<i class="fa-solid fa-right-to-bracket"></i>


&nbsp;


Login


</button>
  <!-- SIGNUP -->

<div class="signup">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</div>



<!-- FOOTER -->

<div class="footer">

© 2026 Rio Maggi Point

<br>

Premium Digital Loyalty Card

</div>



</form>


</div>




<!-- LOGIN JAVASCRIPT -->

<script

type="module"

src="js/login.js">

</script>



</body>

</html>
