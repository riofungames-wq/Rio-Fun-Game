<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rio Loyalty Club | Login</title>

<meta
name="theme-color"
content="#D4AF37">

<link
rel="manifest"
href="manifest.json">

<!-- Google Font -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Global CSS -->

<link
rel="stylesheet"
href="css/style.css">

<!-- Login CSS -->

<link
rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="login-page">

<div class="login-card">

<!-- Logo -->

<div class="logo-box">

<img
src="assets/logo/logo.png"
alt="Rio Logo"
id="logo">

<h1>Welcome Back</h1>

<p>Login to Rio Loyalty Club</p>

</div>

<form id="loginForm"><!-- =========================
LOGIN FORM
========================= -->

<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
required>

</div>

<div class="form-group">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
id="togglePassword"
class="toggle-password">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="remember-row">

<label class="remember-me">

<input
type="checkbox"
id="rememberMe">

<span>Remember Me</span>

</label>

<a
href="#"
id="forgotPassword"
class="forgot-link">

Forgot Password?

</a>

</div>

<div class="button-area">

<button
type="submit"
id="loginBtn"
class="login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

<span>Login</span>

</button>

</div>
<!-- =========================
CREATE ACCOUNT
========================= -->

<div class="signup-link">

<p>

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

<!-- =========================
ADVERTISEMENT
========================= -->

<div class="ads-placeholder">

Future Advertisement

<br>

(Google AdSense)

</div>

</form>

</div>

</div>
<!-- =========================
JAVASCRIPT
========================= -->

<script type="module" src="js/login.js"></script>

</body>

</html>
