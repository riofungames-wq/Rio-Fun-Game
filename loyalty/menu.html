<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point | Premium Menu</title>

<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="css/menu.css">

</head>

<body>

<div class="page">

<div class="menu-container">

<!-- =========================
HEADER
========================= -->

<header class="menu-header">

<a href="card.html"
class="back-button">

<i class="fa-solid fa-arrow-left"></i>

</a>

<div class="header-content">

<h1>

<i class="fa-solid fa-utensils"></i>

RIO MAGGI POINT

</h1>

<p>

Premium Digital Food Menu

</p>

</div>

</header>

<!-- =========================
WELCOME
========================= -->

<section class="welcome-banner">

<div class="welcome-text">

<h2>

🍜 Freshly Cooked.
Made With Love.

</h2>

<p>

Tap any category below to explore
our premium menu.

</p>

</div>

</section>

<!-- =========================
CATEGORY BAR
========================= -->

<nav class="category-bar">

<button
class="menu-tab active"
data-category="everyday">

🍜 Everyday

</button>

<button
class="menu-tab"
data-category="cheese">

🧀 Cheese

</button>

<button
class="menu-tab"
data-category="butter">

🧈 Butter

</button>

<button
class="menu-tab"
data-category="burger">

🍔 Burger

</button>

<button
class="menu-tab"
data-category="momos">

🥟 Momos

</button>

<button
class="menu-tab"
data-category="soup">

🍲 Soup

</button>

<button
class="menu-tab"
data-category="corn">

🌽 Corn

</button>

<button
class="menu-tab"
data-category="bhel">

🥣 Bhel

</button>

</nav>

<!-- =========================
MENU CONTENT
========================= -->

<main id="menuContent">

<!-- JavaScript will render all
categories and menu cards here -->

</main>
<!-- =========================================
     BOTTOM NAVIGATION
========================================= -->

<nav class="bottom-nav">

    <a href="card.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="qr.html">
        <i class="fa-solid fa-qrcode"></i>
        <span>QR</span>
    </a>

    <a href="history.html">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
    </a>

    <a href="menu.html" class="active">
        <i class="fa-solid fa-bowl-food"></i>
        <span>Menu</span>
    </a>

    <a href="feedback.html">
        <i class="fa-solid fa-star"></i>
        <span>Review</span>
    </a>

    <a href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </a>

</nav>

</div>

</div>

<!-- =========================
MENU SCRIPT
========================= -->

<script
type="module"
src="js/menu.js">
</script>
<!-- =========================
PAGE LOADER
========================= -->

<div class="page-loader" id="pageLoader">

    <div class="loader-ring"></div>

    <p>Loading Menu...</p>

</div>

<!-- =========================
OPTIONAL BACK TO TOP
========================= -->

<button
id="backToTop"
class="back-to-top"
aria-label="Back To Top">

    <i class="fa-solid fa-arrow-up"></i>

</button>

<!-- =========================
MENU JAVASCRIPT
========================= -->

<script
type="module"
src="js/menu.js">
</script>

<!-- =========================
SERVICE WORKER
========================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js");

    });

}

</script>

</body>

</html>
