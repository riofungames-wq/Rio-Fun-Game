<!-- ==================================================
     SERVICE WORKER
================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        async function () {

            try {

                await navigator.serviceWorker.register(
                    "./service-worker.js"
                );

                console.log(
                    "Rio Maggi Point Service Worker Registered"
                );

            } catch (error) {

                console.error(
                    "Service Worker Registration Failed:",
                    error
                );

            }

        }
    );

}

</script>
