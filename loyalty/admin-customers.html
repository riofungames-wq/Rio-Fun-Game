<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Rio Maggi Point | Customer Manager
</title>

<link rel="manifest" href="manifest.json">

<link
rel="icon"
href="favicon.ico">

<link
rel="stylesheet"
href="css/admin-customers.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header class="topBar">

<div class="leftHeader">

<a
href="admin-dashboard.html"
class="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<div>

<h1>

<i class="fa-solid fa-users"></i>

Customer Manager

</h1>

<p>

Rio Maggi Point Admin Panel

</p>

</div>

</div>

<div class="rightHeader">

<button id="refreshBtn">

<i class="fa-solid fa-rotate"></i>

Refresh

</button>

</div>

</header>

<!-- ========================= -->
<!-- SEARCH -->
<!-- ========================= -->

<section class="searchCard">

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="searchCustomer"
type="text"
placeholder="Search Customer Name / Member ID / Mobile">

</div>

</section>

<!-- ========================= -->
<!-- STATS -->
<!-- ========================= -->

<section class="statsGrid">

<div class="statCard">

<h2 id="totalCustomers">

0

</h2>

<p>

Total Customers

</p>

</div>

<div class="statCard">

<h2 id="rewardReady">

0

</h2>

<p>

Reward Ready

</p>

</div>

<div class="statCard">

<h2 id="todayJoined">

0

</h2>

<p>

Today's Customers

</p>

</div>

</section>
<!-- ========================= -->
<!-- CUSTOMER TABLE -->
<!-- ========================= -->

<section class="tableCard">

<table>

<thead>

<tr>

<th>Photo</th>

<th>Name</th>

<th>Member ID</th>

<th>Mobile</th>

<th>Stamp</th>

<th>Reward</th>

<th>Action</th>

</tr>

</thead>

<tbody id="customerTable">

<tr>

<td colspan="7">

Loading Customers...

</td>

</tr>

</tbody>

</table>

</section>

<!-- ========================= -->
<!-- CUSTOMER POPUP -->
<!-- ========================= -->

<div
id="customerModal"
class="modal">

<div class="modalCard">

<div class="modalHeader">

<h2>

Customer Details

</h2>

<button id="closeModal">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<div class="modalBody">

<div class="profileBox">

<img
id="modalPhoto"
src="assets/avatars/male.png">

<h3 id="modalName">

Customer Name

</h3>

<p id="modalMember">

RIO-000000

</p>

</div>

<div class="detailRow">

<span>📱 Mobile</span>

<strong id="modalMobile">

-

</strong>

</div>

<div class="detailRow">

<span>⭐ Stamps</span>

<strong id="modalStamp">

0 / 6

</strong>

</div>

<div class="detailRow">

<span>🎁 Reward</span>

<strong id="modalReward">

Locked

</strong>

</div>

<div class="actionGrid">

<button
id="giveStampBtn">

➕

Give Stamp

</button>

<button
id="removeStampBtn">

➖

Remove Stamp

</button>

<button
id="unlockRewardBtn">

🎁

Unlock Reward

</button>

<button
id="deleteCustomerBtn">

🗑

Delete Customer

</button>

</div>

</div>

</div>

</div>

<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<footer class="footer">

Rio Maggi Point Admin Panel

</footer>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script
type="module"
src="js/admin-customers.js">

</script>

</body>

</html>
