<script type="module">

/* =========================================
   RIO MAGGI POINT
   ADMIN PANEL - PART 1
   ========================================= */


/* =========================================
   FIREBASE IMPORTS
   ========================================= */

import {
    auth,
    db
} from "./js/firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
    collection,
    addDoc,
    doc,
    getDoc,
    getDocs,
    updateDoc,
    query,
    where,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================
   HTML ELEMENT REFERENCES
   ========================================= */

const adminStatus =
    document.getElementById("adminStatus");


const customerCard =
    document.getElementById("customerCard");


const customerName =
    document.getElementById("customerName");


const customerMobile =
    document.getElementById("customerMobile");


const stampNumber =
    document.getElementById("stampNumber");


const stampProgress =
    document.getElementById("stampProgress");


const addStampBtn =
    document.getElementById("addStampBtn");


const resetBtn =
    document.getElementById("resetBtn");


const scanAgainBtn =
    document.getElementById("scanAgainBtn");


const logoutBtn =
    document.getElementById("logoutBtn");


const successMessage =
    document.getElementById("successMessage");


const rewardMessage =
    document.getElementById("rewardMessage");


const announcementTitle =
    document.getElementById("announcementTitle");


const announcementType =
    document.getElementById("announcementType");


const announcementMessage =
    document.getElementById("announcementMessage");


const publishAnnouncementBtn =
    document.getElementById("publishAnnouncementBtn");


const announcementAdminStatus =
    document.getElementById("announcementAdminStatus");


const adminAnnouncementList =
    document.getElementById("adminAnnouncementList");


/* =========================================
   APPLICATION STATE
   ========================================= */

let selectedCustomerUID = null;

let selectedCustomerData = null;

let scanner = null;

let scannerRunning = false;


/* =========================================
   ADMIN AUTHENTICATION CHECK
   ========================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        /* =====================================
           USER NOT LOGGED IN
           ===================================== */

        if (!user) {

            window.location.href =
                "admin-login.html";

            return;

        }


        try {

            adminStatus.textContent =
                "🔐 Checking Admin Access...";


            /* =================================
               CHECK ADMIN DOCUMENT
               ================================= */

            const adminRef =
                doc(
                    db,
                    "admins",
                    user.uid
                );


            const adminSnap =
                await getDoc(
                    adminRef
                );


            /* =================================
               ADMIN DOCUMENT NOT FOUND
               ================================= */

            if (!adminSnap.exists()) {

                adminStatus.textContent =
                    "❌ Access Denied";


                alert(
                    "Access Denied. Admin account not found."
                );


                await signOut(
                    auth
                );


                window.location.href =
                    "admin-login.html";


                return;

            }


            /* =================================
               ADMIN VERIFIED
               ================================= */

            adminStatus.textContent =
                "✅ Admin Verified";


            /* =================================
               LOAD ANNOUNCEMENTS
               ================================= */

            await loadAnnouncements();


            /* =================================
               START QR SCANNER
               ================================= */

            await startScanner();

        }

        catch (error) {

            console.error(
                "Admin Verification Error:",
                error
            );


            adminStatus.textContent =
                "❌ Admin Verification Failed";


            alert(
                "❌ Unable to verify admin access. Please try again."
            );

        }

    }
);


/* =========================================
   START QR SCANNER
   ========================================= */

async function startScanner() {

    /* =====================================
       PREVENT DUPLICATE SCANNER
       ===================================== */

    if (scannerRunning) {

        return;

    }


    /* =====================================
       CHECK QR LIBRARY
       ===================================== */

    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        console.error(
            "Html5Qrcode library not loaded."
        );


        alert(
            "❌ QR Scanner library failed to load."
        );


        return;

    }


    try {

        /* =================================
           CREATE SCANNER INSTANCE
           ================================= */

        if (!scanner) {

            scanner =
                new Html5Qrcode(
                    "reader"
                );

        }


        /* =================================
           SCANNER CONFIG
           ================================= */

        const config = {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        };


        /* =================================
           START CAMERA
           ================================= */

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            config,

            onScanSuccess,

            onScanFailure

        );


        scannerRunning =
            true;


        console.log(
            "QR Scanner Started"
        );

    }

    catch (error) {

        console.error(
            "Scanner Start Error:",
            error
        );


        scannerRunning =
            false;


        alert(
            "Camera access failed. Please allow camera permission and try again."
        );

    }

}


/* =========================================
   QR SCAN FAILURE
   ========================================= */

function onScanFailure() {

    /*
       Continuous QR scan failures
       are intentionally ignored.
    */

}


/* =========================================
   QR SCAN SUCCESS
   ========================================= */

async function onScanSuccess(
    decodedText
) {

    /* =====================================
       PREVENT DUPLICATE SCAN
       ===================================== */

    if (selectedCustomerUID) {

        return;

    }


    console.log(
        "QR Scanned:",
        decodedText
    );


    /* =====================================
       EXPECTED QR PREFIX
       ===================================== */

    const prefix =
        "RIO_MAGGI_CUSTOMER:";


    /* =====================================
       VALIDATE QR FORMAT
       ===================================== */

    if (
        !decodedText.startsWith(
            prefix
        )
    ) {

        alert(
            "❌ Invalid Rio Maggi Point QR Code."
        );


        return;

    }


    /* =====================================
       EXTRACT CUSTOMER UID
       ===================================== */

    const uid =
        decodedText
            .slice(
                prefix.length
            )
            .trim();


    /* =====================================
       VALIDATE UID
       ===================================== */

    if (!uid) {

        alert(
            "❌ Invalid Customer QR."
        );


        return;

    }


    /* =====================================
       SAVE SELECTED CUSTOMER
       ===================================== */

    selectedCustomerUID =
        uid;


    /* =====================================
       STOP SCANNER
       ===================================== */

    await stopScanner();


    /* =====================================
       LOAD CUSTOMER
       ===================================== */

    await loadCustomer(
        uid
    );

}


/* =========================================
   STOP QR SCANNER
   ========================================= */

async function stopScanner() {

    if (
        !scanner ||
        !scannerRunning
    ) {

        return;

    }


    try {

        await scanner.stop();


        scannerRunning =
            false;


        console.log(
            "QR Scanner Stopped"
        );

    }

    catch (error) {

        console.error(
            "Scanner Stop Error:",
            error
        );


        scannerRunning =
            false;

    }

}


/* =========================================
   LOAD CUSTOMER DATA
   ========================================= */

async function loadCustomer(
    uid
) {

    try {

        /* =================================
           CUSTOMER DOCUMENT
           ================================= */

        const customerRef =
            doc(
                db,
                "customers",
                uid
            );


        const customerSnap =
            await getDoc(
                customerRef
            );


        /* =================================
           CUSTOMER NOT FOUND
           ================================= */

        if (
            !customerSnap.exists()
        ) {

            alert(
                "❌ Customer account not found."
            );


            resetAdminPanel();


            await startScanner();


            return;

        }


        /* =================================
           SAVE CUSTOMER DATA
           ================================= */

        selectedCustomerData =
            customerSnap.data();


        /* =================================
           CUSTOMER NAME
           ================================= */

        customerName.textContent =
            selectedCustomerData.name ||
            "Customer";


        /* =================================
           CUSTOMER MOBILE
           ================================= */

        customerMobile.textContent =
            selectedCustomerData.mobile ||
            "Not Available";


        /* =================================
           SHOW CUSTOMER CARD
           ================================= */

        customerCard.style.display =
            "block";


        /* =================================
           GET STAMP COUNT
           ================================= */

        const stamps =
            Math.min(
                Math.max(
                    Number(
                        selectedCustomerData.stamps || 0
                    ),
                    0
                ),
                6
            );


        /* =================================
           UPDATE STAMP DISPLAY
           ================================= */

        updateStampDisplay(
            stamps
        );


        /* =================================
           HIDE OLD MESSAGES
           ================================= */

        successMessage.style.display =
            "none";


        rewardMessage.style.display =
            "none";


        /* =================================
           CHECK REWARD STATUS
           ================================= */

        if (

            stamps >= 6 ||

            selectedCustomerData.rewardUnlocked ===
                true

        ) {

            showRewardReady();

        }

        else {

            resetBtn.style.display =
                "none";


            enableStampButton();

        }


        /* =================================
           CHECK DAILY STAMP STATUS
           ================================= */

        checkDailyStampStatus();

    }

    catch (error) {

        console.error(
            "Customer Load Error:",
            error
        );


        alert(
            "❌ Unable to load customer data."
        );


        resetAdminPanel();


        await startScanner();

    }

}


/* =========================================
   UPDATE STAMP DISPLAY
   ========================================= */

function updateStampDisplay(
    stamps
) {

    /* =====================================
       KEEP STAMPS BETWEEN 0 AND 6
       ===================================== */

    const safeStamps =
        Math.min(
            Math.max(
                Number(
                    stamps
                ) || 0,
                0
            ),
            6
        );


    /* =====================================
       UPDATE NUMBER
       ===================================== */

    stampNumber.textContent =
        safeStamps;


    /* =====================================
       CLEAR OLD STAMPS
       ===================================== */

    stampProgress.innerHTML =
        "";


    /* =====================================
       CREATE 6 STAMP DOTS
       ===================================== */

    for (

        let i = 1;

        i <= 6;

        i++

    ) {

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "stamp-dot";


        /* =================================
           COMPLETED STAMP
           ================================= */

        if (
            i <= safeStamps
        ) {

            dot.classList.add(
                "done"
            );


            dot.textContent =
                "✓";

        }

        /* =================================
           EMPTY STAMP
           ================================= */

        else {

            dot.textContent =
                i;

        }


        stampProgress.appendChild(
            dot
        );

    }

}


/* =========================================
   CONVERT FIRESTORE DATE
   ========================================= */

function getDateValue(
    timestamp
) {

    /* =====================================
       NO DATE
       ===================================== */

    if (!timestamp) {

        return null;

    }


    try {

        /* =================================
           FIRESTORE TIMESTAMP
           ================================= */

        if (

            typeof timestamp.toDate ===
            "function"

        ) {

            return timestamp.toDate();

        }


        /* =================================
           JAVASCRIPT DATE
           ================================= */

        if (
            timestamp instanceof Date
        ) {

            return timestamp;

        }


        /* =================================
           STRING / NUMBER DATE
           ================================= */

        const parsedDate =
            new Date(
                timestamp
            );


        /* =================================
           INVALID DATE
           ================================= */

        if (

            Number.isNaN(
                parsedDate.getTime()
            )

        ) {

            return null;

        }


        return parsedDate;

    }

    catch (error) {

        console.error(
            "Date Conversion Error:",
            error
        );


        return null;

    }

}


/* =========================================
   CHECK SAME CALENDAR DAY
   ========================================= */

function isSameCalendarDay(
    dateA,
    dateB = new Date()
) {

    if (
        !dateA ||
        !dateB
    ) {

        return false;

    }


    return (

        dateA.getFullYear() ===
        dateB.getFullYear()

        &&

        dateA.getMonth() ===
        dateB.getMonth()

        &&

        dateA.getDate() ===
        dateB.getDate()

    );

}


/* =========================================
   DAILY STAMP CHECK
   ========================================= */

function checkDailyStampStatus() {

    const lastStampDate =
        getDateValue(
            selectedCustomerData?.lastStampAt
        );


    /* =====================================
       NO PREVIOUS STAMP
       ===================================== */

    if (!lastStampDate) {

        enableStampButton();

        return;

    }


    /* =====================================
       SAME DAY = STAMP BLOCKED
       ===================================== */

    if (
        isSameCalendarDay(
            lastStampDate
        )
    ) {

/* =========================================
   ADD DAILY STAMP
   ========================================= */

addStampBtn.addEventListener(
    "click",
    async () => {

        /* =====================================
           CHECK CUSTOMER SELECTION
           ===================================== */

        if (!selectedCustomerUID) {

            alert(
                "Please scan a customer QR first."
            );

            return;

        }


        /* =====================================
           CHECK CUSTOMER DATA
           ===================================== */

        if (!selectedCustomerData) {

            alert(
                "Customer data not loaded."
            );

            return;

        }


        /* =====================================
           GET CURRENT STAMPS
           ===================================== */

        const currentStamps =
            Math.min(
                Math.max(
                    Number(
                        selectedCustomerData.stamps || 0
                    ),
                    0
                ),
                6
            );


        /* =====================================
           CHECK REWARD ALREADY UNLOCKED
           ===================================== */

        if (

            currentStamps >= 6 ||

            selectedCustomerData.rewardUnlocked ===
                true

        ) {

            showRewardReady();

            return;

        }


        /* =====================================
           CHECK TODAY'S STAMP
           ===================================== */

        const lastStampDate =
            getDateValue(
                selectedCustomerData.lastStampAt
            );


        if (
            isSameCalendarDay(
                lastStampDate
            )
        ) {

            alert(

                "📅 Today's stamp has already been given.\n\n" +

                "Only one stamp is allowed per customer per day."

            );


            checkDailyStampStatus();


            return;

        }


        /* =====================================
           DISABLE BUTTON WHILE PROCESSING
           ===================================== */

        addStampBtn.disabled =
            true;


        addStampBtn.textContent =
            "⏳ Adding Stamp...";


        try {

            /* =================================
               CALCULATE NEW STAMP COUNT
               ================================= */

            const newStampCount =
                currentStamps + 1;


            /* =================================
               CUSTOMER FIRESTORE DOCUMENT
               ================================= */

            const customerRef =
                doc(
                    db,
                    "customers",
                    selectedCustomerUID
                );


            /* =================================
               UPDATE CUSTOMER STAMPS
               ================================= */

            await updateDoc(

                customerRef,

                {

                    stamps:
                        newStampCount,


                    rewardUnlocked:
                        newStampCount >= 6,


                    rewardRedeemed:
                        false,


                    lastStampAt:
                        serverTimestamp(),


                    updatedAt:
                        serverTimestamp()

                }

            );


            /* =================================
               UPDATE LOCAL DATA
               ================================= */

            selectedCustomerData.stamps =
                newStampCount;


            selectedCustomerData.rewardUnlocked =
                newStampCount >= 6;


            selectedCustomerData.rewardRedeemed =
                false;


            selectedCustomerData.lastStampAt =
                new Date();


            /* =================================
               UPDATE UI
               ================================= */

            updateStampDisplay(
                newStampCount
            );


            /* =================================
               SUCCESS MESSAGE
               ================================= */

            successMessage.style.display =
                "block";


            successMessage.textContent =
                "✅ Today's stamp added successfully!";


            /* =================================
               CHECK 6 STAMPS COMPLETED
               ================================= */

            if (
                newStampCount >= 6
            ) {

                showRewardReady();

            }

            else {

                /* =============================
                   DAILY LIMIT REACHED
                   ============================= */

                addStampBtn.disabled =
                    true;


                addStampBtn.textContent =
                    "📅 Today's Stamp Already Added";

            }

        }

        catch (error) {

            console.error(
                "Add Stamp Error:",
                error
            );


            alert(
                "❌ Unable to add stamp. Please try again."
            );


            /* =================================
               RESTORE BUTTON
               ================================= */

            addStampBtn.disabled =
                false;


            addStampBtn.textContent =
                "✅ Accept & Add 1 Stamp";

        }

    }
);

/* =========================================

   ========================================= */

publishAnnouncementBtn.addEventListener(
    "click",
    async () => {

        /* =====================================
           GET FORM VALUES
           ===================================== */

        const title =
            announcementTitle.value.trim();


        const type =
            announcementType.value;


        const message =
            announcementMessage.value.trim();


        /* =====================================
           VALIDATE TITLE
           ===================================== */

        if (!title) {

            showAnnouncementStatus(

                "⚠️ Please enter an announcement title.",

                "error"

            );


            announcementTitle.focus();


            return;

        }


        /* =====================================
           VALIDATE MESSAGE
           ===================================== */

        if (!message) {

            showAnnouncementStatus(

                "⚠️ Please write an announcement message.",

                "error"

            );


            announcementMessage.focus();


            return;

        }


        /* =====================================
           DISABLE PUBLISH BUTTON
           ===================================== */

        publishAnnouncementBtn.disabled =
            true;


        publishAnnouncementBtn.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            Publishing...

        `;


        try {

            /* =================================
               CREATE ANNOUNCEMENT DATA
               ================================= */

            const announcementData = {

                title:
                    title,


                type:
                    type,


                message:
                    message,


                active:
                    true,


                createdAt:
                    serverTimestamp()

            };


            /* =================================
               SAVE TO FIRESTORE
               ================================= */

            await addDoc(

                collection(
                    db,
                    "announcements"
                ),

                announcementData

            );


            /* =================================
               SUCCESS STATUS
               ================================= */

            showAnnouncementStatus(

                "✅ Announcement published successfully. It is now available to your users.",

                "success"

            );


            /* =================================
               CLEAR FORM
               ================================= */

            announcementTitle.value =
                "";


            announcementMessage.value =
                "";


            announcementType.value =
                "offer";


            /* =================================
               REFRESH ANNOUNCEMENT LIST
               ================================= */

            await loadAnnouncements();

        }

        catch (error) {

            console.error(
                "Announcement Publish Error:",
                error
            );


            showAnnouncementStatus(

                "❌ Failed to publish announcement. Please try again.",

                "error"

            );

        }

        finally {

            /* =================================
               RESTORE PUBLISH BUTTON
               ================================= */

            publishAnnouncementBtn.disabled =
                false;


            publishAnnouncementBtn.innerHTML = `

                <i class="fa-solid fa-paper-plane"></i>

                Publish Announcement

            `;

        }

    }
);


/* =========================================
   LOAD ACTIVE ANNOUNCEMENTS
   ========================================= */

async function loadAnnouncements() {

    try {

        /* =====================================
           LOADING MESSAGE
           ===================================== */

        adminAnnouncementList.innerHTML = `

            <div class="announcement-item">

                <div class="announcement-item-message">

                    Loading announcements...

                </div>

            </div>

        `;


        /* =====================================
           ANNOUNCEMENTS COLLECTION
           ===================================== */

        const announcementsRef =
            collection(
                db,
                "announcements"
            );


        /* =====================================
           QUERY ACTIVE ANNOUNCEMENTS
           ===================================== */

        const announcementsQuery =
            query(

                announcementsRef,


                where(
                    "active",
                    "==",
                    true
                ),


                orderBy(
                    "createdAt",
                    "desc"
                )

            );


        /* =====================================
           GET FIRESTORE DATA
           ===================================== */

        const snapshot =
            await getDocs(
                announcementsQuery
            );


        /* =====================================
           CLEAR LIST
           ===================================== */

        adminAnnouncementList.innerHTML =
            "";


        /* =====================================
           NO ANNOUNCEMENTS
           ===================================== */

        if (
            snapshot.empty
        ) {

            adminAnnouncementList.innerHTML = `

                <div class="announcement-item">

                    <div class="announcement-item-message">

                        No active announcements yet.

                    </div>

                </div>

            `;


            return;

        }


        /* =====================================
           CREATE ANNOUNCEMENT ITEMS
           ===================================== */

        snapshot.forEach(
            (announcementDoc) => {

                const data =
                    announcementDoc.data();


                /* =================================
                   MAIN ITEM
                   ================================= */

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "announcement-item";


                /* =================================
                   TITLE
                   ================================= */

                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "announcement-item-title";


                title.textContent =

                    getAnnouncementIcon(
                        data.type
                    ) +

                    " " +

                    (
                        data.title ||
                        "Announcement"
                    );


                /* =================================
                   MESSAGE
                   ================================= */

                const message =
                    document.createElement(
                        "div"
                    );


                message.className =
                    "announcement-item-message";


                message.textContent =
                    data.message ||
                    "";


                /* =================================
                   META
                   ================================= */

                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "announcement-item-meta";


                meta.textContent =
                    "Status: Active";


                /* =================================
                   DELETE BUTTON
                   ================================= */

                const deleteBtn =
                    document.createElement(
                        "button"
                    );


                deleteBtn.className =
                    "delete-announcement-btn";


                deleteBtn.textContent =
                    "🗑️ Delete Announcement";


                deleteBtn.addEventListener(

                    "click",

                    () => {

                        deleteAnnouncement(

                            announcementDoc.id

                        );

                    }

                );


                /* =================================
                   BUILD ANNOUNCEMENT ITEM
                   ================================= */

                item.appendChild(
                    title
                );


                item.appendChild(
                    message
                );


                item.appendChild(
                    meta
                );


                item.appendChild(
                    deleteBtn
                );


                adminAnnouncementList.appendChild(
                    item
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Load Announcements Error:",
            error
        );


        /* =====================================
           FIRESTORE INDEX / QUERY ERROR
           ===================================== */

        adminAnnouncementList.innerHTML = `

            <div class="announcement-item">

                <div class="announcement-item-message">

                    ❌ Unable to load announcements.

                </div>

            </div>

        `;

    }

}


/* =========================================
   ANNOUNCEMENT ICON
   ========================================= */

function getAnnouncementIcon(
    type
) {

    switch (type) {

        case "offer":

            return "🍜";


        case "update":

            return "📢";


        case "event":

            return "🎉";


        case "general":

            return "ℹ️";


        default:

            return "📢";

    }

}


/* =========================================
   DELETE ANNOUNCEMENT
   SOFT DELETE
   ========================================= */

async function deleteAnnouncement(
    announcementId
) {

    /* =====================================
       CONFIRM DELETE
       ===================================== */

    const confirmed =
        confirm(

            "🗑️ Delete this announcement?\n\n" +

            "It will no longer be shown to customers."

        );


    if (!confirmed) {

        return;

    }


    try {

        /* =================================
           ANNOUNCEMENT DOCUMENT
           ================================= */

        const announcementRef =
            doc(

                db,

                "announcements",

                announcementId

            );


        /* =================================
           SOFT DELETE
           ================================= */

        await updateDoc(

            announcementRef,

            {

                active:
                    false,


                deletedAt:
                    serverTimestamp()

            }

        );


        /* =================================
           SUCCESS STATUS
           ================================= */

        showAnnouncementStatus(

            "✅ Announcement removed successfully.",

            "success"

        );


        /* =================================
           REFRESH LIST
           ================================= */

        await loadAnnouncements();

    }

    catch (error) {

        console.error(
            "Delete Announcement Error:",
            error
        );


        showAnnouncementStatus(

            "❌ Failed to delete announcement.",

            "error"

        );

    }

}
