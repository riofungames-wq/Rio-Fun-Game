<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile | Rio Maggi Point</title>

<link rel="stylesheet"
href="css/profile.css">

</head>

<body>

<div class="profile-page">

<h2>👤 My Profile</h2>

<div class="profile-card">

<div class="profile-preview">

<img
id="previewImage"
src="assets/avatars/male.png"
alt="Profile">

</div>

<h3>Default Avatar</h3>

<div class="avatar-choice">

<label>

<input
type="radio"
name="avatarType"
value="male"
checked>

👨 Male

</label>

<label>

<input
type="radio"
name="avatarType"
value="female">

👩 Female

</label>

</div>

<label
class="upload-btn">

📷 Upload Photo

<input
id="photoInput"
type="file"
accept="image/*"
hidden>

</label>

<div class="buttons">

<button
id="saveAvatar">

💾 Save Profile

</button>

<button
id="removeAvatar">

🗑 Remove Photo

</button>

</div>

</div>
<!-- Bottom Navigation -->

<nav class="bottom-nav">

</nav>

</div>

type="module"
src="js/profile.js"></script>

</body>

</html>
