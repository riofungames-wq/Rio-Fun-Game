<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Rio Maggi Point • Profile
</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/profile.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<div class="profile-card-main">

<div class="card-glow"></div>

<!-- HEADER -->

<header class="profile-header">

<h1>

<i class="fa-solid fa-user"></i>

My Profile

</h1>

<p>

Rio Maggi Point Premium Member

</p>

</header>

<!-- PROFILE USER -->

<section class="profile-user">

<div class="profile-photo">

<img

id="profilePhoto"

src="assets/avatars/default.png"

alt="Customer">

</div>

<h2 id="profileName">

Loading...

</h2>

<p class="member-id">

<i class="fa-solid fa-id-card"></i>

<span id="profileMemberId">

RIO-000000

</span>

</p>

<div class="premium-badge">

<i class="fa-solid fa-crown"></i>

PREMIUM MEMBER

</div>

</section>

<!-- PROFILE DETAILS -->

<section class="profile-details">

<div class="detail-card">

<div class="detail-icon">

📱

</div>

<div>

<span>

Mobile

</span>

<strong id="profileMobile">

--

</strong>

</div>

</div>

<div class="detail-card">

<div class="detail-icon">

📧

</div>

<div>

<span>

Email

</span>

<strong id="profileEmail">

--

</strong>

</div>

</div>

<div class="detail-card">

<div class="detail-icon">

🎂

</div>

<div>

<span>

Date Of Birth

</span>

<strong id="profileDOB">

--

</strong>

</div>

</div>

<div class="detail-card">

<div class="detail-icon">

🎈

</div>

<div>

<span>

Age

</span>

<strong id="profileAge">

--

</strong>

</div>

</div>

<div class="detail-card">

<div class="detail-icon">

👤

</div>

<div>

<span>

Category

</span>

<strong id="profileCategory">

--

</strong>

</div>

</div>

</section>

<!-- ================= LOYALTY SUMMARY ================= -->

<section class="loyalty-summary">

<h2>

Loyalty Summary

</h2>

<div class="summary-card">

<div class="summary-item">

<span>

⭐ Current Stamps

</span>

<strong id="profileStampCount">

0 / 6

</strong>

</div>

<div class="summary-item">

<span>

🎁 Reward Status

</span>

<strong id="profileReward">

Locked

</strong>

</div>

<div class="summary-item">

<span>

📅 Member Since

</span>

<strong id="profileMemberSince">

--

</strong>

</div>

</div>

</section>

<!-- ================= EDIT PROFILE MODAL ================= -->

<div

id="editModal"

class="edit-modal"

style="display:none;">

<div class="edit-box">

<h2>

Edit Profile

</h2>

<label>

Full Name

</label>

<input

type="text"

id="editName"

placeholder="Enter Name">

<label>

Date Of Birth

</label>

<input

type="date"

id="editDOB">

<label>

Age

</label>

<input

type="number"

id="editAge"

placeholder="Enter Age">

<label>

Gender

</label>

<select id="editGender">

<option value="">

Select Gender

</option>

<option value="male">

Male

</option>

<option value="female">

Female

</option>

<option value="other">

Other

</option>

</select>

<div class="edit-buttons">

<button

id="saveProfileBtn"

class="primary-btn">

<i class="fa-solid fa-check"></i>

Save

</button>

<button

id="closeEditBtn"

class="logout-btn">

Cancel

</button>

</div>

</div>

</div>

<!-- ================= ACTION BUTTONS ================= -->

<section class="profile-actions">

<button

id="editProfileBtn"

class="primary-btn">

<i class="fa-solid fa-pen"></i>

Edit Profile

</button>

<button

id="logoutBtn"

class="logout-btn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</section>

<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

<a href="card.html">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<a href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>

QR

</span>

</a>

<a href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>

History

</span>

</a>

<a href="menu.html">

<i class="fa-solid fa-utensils"></i>

<span>

Menu

</span>

</a>
<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>

Review

</span>

</a>

<a

href="profile.html"

class="active">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

</div>

</div>

<!-- ================= PROFILE JAVASCRIPT ================= -->

<script

type="module"

src="js/profile.js">

</script>

</body>

</html>
