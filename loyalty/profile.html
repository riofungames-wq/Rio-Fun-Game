<!-- =========================================
     FIREBASE MODULE
========================================= -->

<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged,

    signOut,

    deleteUser

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {

    getFirestore,

    doc,

    getDoc,

    setDoc,

    updateDoc,

    serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


import {

    firebaseConfig

}

from

"./js/firebase-config.js";



/* =========================================
   FIREBASE INITIALIZE
========================================= */

const app =

    initializeApp(

        firebaseConfig

    );


const auth =

    getAuth(

        app

    );


const db =

    getFirestore(

        app

    );



/* =========================================
   HTML ELEMENTS
========================================= */

const profileName =

    document.getElementById(

        "profileName"

    );


const profileEmail =

    document.getElementById(

        "profileEmail"

    );


const profilePhoto =

    document.getElementById(

        "profilePhoto"

    );


const defaultAvatar =

    document.getElementById(

        "defaultAvatar"

    );


const photoInput =

    document.getElementById(

        "photoInput"

    );


const editName =

    document.getElementById(

        "editName"

    );


const editEmail =

    document.getElementById(

        "editEmail"

    );


const memberId =

    document.getElementById(

        "memberId"

    );


const memberSince =

    document.getElementById(

        "memberSince"

    );


const profileStamps =

    document.getElementById(

        "profileStamps"

    );


const profileReward =

    document.getElementById(

        "profileReward"

    );


const saveProfileBtn =

    document.getElementById(

        "saveProfileBtn"

    );


const profileMessage =

    document.getElementById(

        "profileMessage"

    );


const logoutBtn =

    document.getElementById(

        "logoutBtn"

    );


const deleteAccountBtn =

    document.getElementById(

        "deleteAccountBtn"

    );



/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(

    message,

    type

) {


    profileMessage.textContent =

        message;


    profileMessage.className =

        "profile-message " +

        type;


}



/* =========================================
   CLEAR LOADING STATE
========================================= */

function removeLoading() {


    profileName.classList.remove(

        "profile-loading"

    );


    profileEmail.classList.remove(

        "profile-loading"

    );


}



/* =========================================
   LOAD PROFILE DATA
========================================= */

async function loadProfile(

    user

) {


    try {


        const userRef =

            doc(

                db,

                "customers",

                user.uid

            );


        const userSnap =

            await getDoc(

                userRef

            );


        let data = {};


        if (

            userSnap.exists()

        ) {


            data =

                userSnap.data();


        }



        /* =================================
           NAME
        ================================= */

        const name =

            data.name ||

            user.displayName ||

            "Customer";


        profileName.textContent =

            name;


        editName.value =

            name;



        /* =================================
           EMAIL
        ================================= */

        const email =

            data.email ||

            user.email ||

            "";


        profileEmail.textContent =

            email;


        editEmail.value =

            email;



        /* =================================
           MEMBER ID
        ================================= */

        memberId.textContent =

            data.memberId ||

            (

                "RIO-" +

                user.uid

                    .substring(

                        0,

                        6

                    )

                    .toUpperCase()

            );



        /* =================================
           MEMBER SINCE
        ================================= */

        if (

            data.memberSince

        ) {


            memberSince.textContent =

                data.memberSince;


        }


        else if (

            data.createdAt &&

            data.createdAt.toDate

        ) {


            memberSince.textContent =

                data.createdAt

                    .toDate()

                    .toLocaleDateString(

                        "en-IN",

                        {

                            day: "2-digit",

                            month: "short",

                            year: "numeric"

                        }

                    );


        }


        else {


            memberSince.textContent =

                "Premium Member";


        }



        /* =================================
           STAMPS
        ================================= */

        const stamps =

            Number(

                data.stamps || 0

            );


        profileStamps.textContent =

            Math.min(

                Math.max(

                    stamps,

                    0

                ),

                6

            ) +

            " / 6";



        /* =================================
           REWARD STATUS
        ================================= */

        if (

            stamps >= 6

        ) {


            profileReward.textContent =

                "FREE VEG MAGGI UNLOCKED";


        }


        else {


            profileReward.textContent =

                "Collecting";


        }



        /* =================================
           PROFILE PHOTO
        ================================= */

        const photoURL =

            data.photoURL ||

            user.photoURL;


        if (

            photoURL

        ) {


            profilePhoto.src =

                photoURL;


            profilePhoto.style.display =

                "block";


            defaultAvatar.style.display =

                "none";


        }


        else {


            profilePhoto.style.display =

                "none";


            defaultAvatar.style.display =

                "block";


        }


        removeLoading();


    }


    catch (error) {


        console.error(

            "Profile Loading Error:",

            error

        );


        profileName.textContent =

            "Customer";


        profileEmail.textContent =

            user.email ||

            "";


        removeLoading();


        showMessage(

            "Unable to load some profile information.",

            "error"

        );


    }


}



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(

    auth,

    async (user) => {


        if (

            !user

        ) {


            window.location.href =

                "login.html";


            return;


        }


        currentUser =

            user;


        await loadProfile(

            user

        );


    }

);



/* =========================================
   PROFILE PHOTO PREVIEW
========================================= */

photoInput.addEventListener(

    "change",

    (event) => {


        const file =

            event.target.files[0];


        if (

            !file

        ) {


            return;


        }


        if (

            !file.type.startsWith(

                "image/"

            )

        ) {


            showMessage(

                "Please select a valid image.",

                "error"

            );


            return;


        }


        const reader =

            new FileReader();


        reader.onload =

            () => {


                profilePhoto.src =

                    reader.result;


                profilePhoto.style.display =

                    "block";


                defaultAvatar.style.display =

                    "none";


            };


        reader.readAsDataURL(

            file

        );


    }

);



/* =========================================
   SAVE PROFILE
========================================= */

saveProfileBtn.addEventListener(

    "click",

    async () => {


        if (

            !currentUser

        ) {


            return;


        }


        const newName =

            editName.value.trim();


        if (

            !newName

        ) {


            showMessage(

                "Please enter your name.",

                "error"

            );


            return;


        }


        try {


            saveProfileBtn.disabled =

                true;


            saveProfileBtn.innerHTML =

                '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';



            const userRef =

                doc(

                    db,

                    "customers",

                    currentUser.uid

                );


            await setDoc(

                userRef,

                {

                    name:

                        newName,

                    email:

                        currentUser.email ||

                        "",

                    updatedAt:

                        serverTimestamp()

                },

                {

                    merge:

                        true

                }

            );


            profileName.textContent =

                newName;


            showMessage(

                "Profile updated successfully!",

                "success"

            );


        }


        catch (error) {


            console.error(

                "Profile Save Error:",

                error

            );


            showMessage(

                "Unable to save profile. Please try again.",

                "error"

            );


        }


        finally {


            saveProfileBtn.disabled =

                false;


            saveProfileBtn.innerHTML =

                '<i class="fa-solid fa-floppy-disk"></i> Save Profile';


        }


    }

);



/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(

    "click",

    async () => {


        try {


            await signOut(

                auth

            );


            window.location.href =

                "login.html";


        }


        catch (error) {


            console.error(

                "Logout Error:",

                error

            );


            showMessage(

                "Logout failed. Please try again.",

                "error"

            );


        }


    }

);



/* =========================================
   DELETE ACCOUNT
========================================= */

deleteAccountBtn.addEventListener(

    "click",

    async () => {


        if (

            !currentUser

        ) {


            return;


        }


        const confirmed =

            confirm(

                "Are you sure you want to delete your account? This action cannot be undone."

            );


        if (

            !confirmed

        ) {


            return;


        }


        try {


            await deleteUser(

                currentUser

            );


            window.location.href =

                "signup.html";


        }


        catch (error) {


            console.error(

                "Delete Account Error:",

                error

            );


            showMessage(

                "Account deletion failed. Please login again and try.",

                "error"

            );


        }


    }

);


</script>



<!-- =========================================
     SERVICE WORKER
========================================= -->

<script>


if (

    "serviceWorker"

    in navigator

) {


    window.addEventListener(

        "load",

        async () => {


            try {


                await navigator.serviceWorker.register(

                    "./service-worker.js"

                );


            }


            catch (error) {


                console.error(

                    "Service Worker Error:",

                    error

                );


            }


        }

    );


}


</script>
