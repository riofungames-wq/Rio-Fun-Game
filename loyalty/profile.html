<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Rio Maggi Point • Profile

</title>

<meta
name="theme-color"
content="#111111">

<meta
name="description"
content="Rio Maggi Point Premium Customer Profile">

<link
rel="manifest"
href="manifest.json">

<link
rel="icon"
href="favicon.ico">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- COMMON CSS -->

<link
rel="stylesheet"
href="css/common.css">

<!-- PROFILE CSS -->

<link
rel="stylesheet"
href="css/profile.css">

</head>


<body>


<!-- =====================================
     MAIN PAGE
===================================== -->

<div class="page">


<!-- =====================================
     PROFILE CARD
===================================== -->

<div class="profile-card-main app-card">


<div class="card-glow"></div>

<div class="card-shine"></div>


<!-- =====================================
     PROFILE HEADER
===================================== -->

<header class="profile-header">

<h1>

<i class="fa-solid fa-user"></i>

My Profile

</h1>


<p>

Rio Maggi Point Premium Member

</p>

</header>


<!-- =====================================
     PROFILE USER
===================================== -->

<section class="profile-user">


<div class="profile-photo">

<img

id="profilePhoto"

src="assets/avatars/default.png"

alt="Customer">

</div>


<h2 id="profileName">

Loading...

</h2>


<p class="member-id">

<i class="fa-solid fa-id-card"></i>

<span id="profileMemberId">

RIO-000000

</span>

</p>


<div class="premium-badge">

<i class="fa-solid fa-crown"></i>

PREMIUM MEMBER

</div>


</section>


<!-- =====================================
     PROFILE PART 1 END
===================================== -->
  <!-- =====================================
     PROFILE DETAILS
===================================== -->

<section class="profile-details">


<!-- =====================================
     MOBILE
===================================== -->

<div class="detail-card">

<div class="detail-icon">

📱

</div>

<div>

<span>

Mobile

</span>

<strong id="profileMobile">

--

</strong>

</div>

</div>


<!-- =====================================
     EMAIL
===================================== -->

<div class="detail-card">

<div class="detail-icon">

📧

</div>

<div>

<span>

Email

</span>

<strong id="profileEmail">

--

</strong>

</div>

</div>


<!-- =====================================
     DATE OF BIRTH
===================================== -->

<div class="detail-card">

<div class="detail-icon">

🎂

</div>

<div>

<span>

Date Of Birth

</span>

<strong id="profileDOB">

--

</strong>

</div>

</div>


<!-- =====================================
     AGE
===================================== -->

<div class="detail-card">

<div class="detail-icon">

🎈

</div>

<div>

<span>

Age

</span>

<strong id="profileAge">

--

</strong>

</div>

</div>


<!-- =====================================
     CATEGORY
===================================== -->

<div class="detail-card">

<div class="detail-icon">

👤

</div>

<div>

<span>

Category

</span>

<strong id="profileCategory">

--

</strong>

</div>

</div>


</section>


<!-- =====================================
     LOYALTY SUMMARY
===================================== -->

<section class="loyalty-summary">


<h2>

Loyalty Summary

</h2>


<div class="summary-card">


<!-- CURRENT STAMPS -->

<div class="summary-item">

<span>

⭐ Current Stamps

</span>

<strong id="profileStampCount">

0 / 6

</strong>

</div>


<!-- REWARD STATUS -->

<div class="summary-item">

<span>

🎁 Reward Status

</span>

<strong id="profileReward">

Locked

</strong>

</div>


<!-- MEMBER SINCE -->

<div class="summary-item">

<span>

📅 Member Since

</span>

<strong id="profileMemberSince">

--

</strong>

</div>


</div>


</section>


<!-- =====================================
     EDIT PROFILE MODAL
===================================== -->

<div

id="editModal"

class="edit-modal"

style="display:none;">


<div class="edit-box">


<h2>

Edit Profile

</h2>


<!-- FULL NAME -->

<label>

Full Name

</label>

<input

type="text"

id="editName"

placeholder="Enter Name">


<!-- DATE OF BIRTH -->

<label>

Date Of Birth

</label>

<input

type="date"

id="editDOB">


<!-- AGE -->

<label>

Age

</label>

<input

type="number"

id="editAge"

placeholder="Enter Age">


<!-- GENDER -->

<label>

Gender

</label>

<select id="editGender">

<option value="">

Select Gender

</option>

<option value="male">

Male

</option>

<option value="female">

Female

</option>

<option value="other">

Other

</option>

</select>


<!-- =====================================
     EDIT BUTTONS
===================================== -->

<div class="edit-buttons">


<button

id="saveProfileBtn"

class="primary-btn"

type="button">

<i class="fa-solid fa-check"></i>

Save

</button>


<button

id="closeEditBtn"

class="logout-btn"

type="button">

Cancel

</button>


</div>


</div>


</div>


<!-- =====================================
     PROFILE PART 2 END
===================================== -->
  <!-- =====================================
     PROFILE ACTIONS
===================================== -->

<section class="profile-actions">


<!-- EDIT PROFILE -->

<button

id="editProfileBtn"

class="primary-btn"

type="button">

<i class="fa-solid fa-pen"></i>

Edit Profile

</button>


<!-- LOGOUT -->

<button

id="logoutBtn"

class="logout-btn"

type="button">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>


</section>


<!-- =====================================
     SAFE SPACE FOR BOTTOM NAV
===================================== -->

<div class="nav-space"></div>

===================================== -->

<span>

<a href="menu.html">

<i class="fa-solid fa-utensils"></i>

<span>

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>

Review

<!-- PROFILE -->

<a

href="profile.html"

class="active">

<i class="fa-solid fa-user"></i>

<span>

</span>

</nav>


</div>


</div>


<!-- =====================================
     PROFILE JAVASCRIPT
===================================== -->

<script

type="module"

src="js/profile.js">

</script>


<!-- =====================================
     SERVICE WORKER
===================================== -->

<script>

if("serviceWorker" in navigator){

window.addEventListener(

"load",

async()=>{

try{

await navigator.serviceWorker.register(

"./service-worker.js"

);

console.log(

"Service Worker Registered"

);

}

catch(error){

console.error(

"Service Worker Registration Failed:",

error

);

}

}

);

}

</script>


<!-- =====================================
     PROFILE.HTML END
===================================== -->

</body>

</html>
