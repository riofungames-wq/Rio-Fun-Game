<body>

<div class="page">

<!-- ========================================= -->
<!-- PREMIUM LOYALTY CARD -->
<!-- ========================================= -->

<div id="loyaltyCard" class="loyalty-card theme-male">

    <!-- Background Effects -->

    <div class="card-bg-circle circle-1"></div>
    <div class="card-bg-circle circle-2"></div>

    <!-- Top Header -->

    <div class="card-header">

        <div class="brand-area">

            <img
            class="brand-logo"
            src="assets/logo/logo.png"
            alt="Rio Logo">

            <div class="brand-text">

                <h1>RIO MAGGI POINT</h1>

                <span>Premium Loyalty Club</span>

            </div>

        </div>

        <div class="premium-badge">

            PREMIUM

        </div>

    </div>

    <!-- ========================================= -->
    <!-- CUSTOMER PROFILE -->
    <!-- ========================================= -->

    <div class="customer-section">

        <div class="avatar-area">

            <div class="avatar-ring"></div>

            <img
            id="customerPhoto"
            src="assets/avatars/male.png"
            alt="Avatar">

        </div>

        <div class="customer-details">

            <div
            id="customerName"
            class="customer-name">

                Loading...

            </div>

            <div
            id="memberId"
            class="member-id">

                ID : -----

            </div>

        </div>

    </div>

    <!-- ========================================= -->
    <!-- CARD DIVIDER -->
    <!-- ========================================= -->

    <div class="premium-divider"></div>
        <!-- ========================================= -->
    <!-- STAMP SECTION -->
    <!-- ========================================= -->

    <div class="stamp-section">

        <div class="section-title">

            YOUR STAMP PROGRESS

        </div>

        <div class="stamp-grid">

            <div class="stamp-box">

                <div class="stamp-number">1</div>

                <div id="date1" class="stamp-date"></div>

            </div>

            <div class="stamp-box">

                <div class="stamp-number">2</div>

                <div id="date2" class="stamp-date"></div>

            </div>

            <div class="stamp-box">

                <div class="stamp-number">3</div>

                <div id="date3" class="stamp-date"></div>

            </div>

            <div class="stamp-box">

                <div class="stamp-number">4</div>

                <div id="date4" class="stamp-date"></div>

            </div>

            <div class="stamp-box">

                <div class="stamp-number">5</div>

                <div id="date5" class="stamp-date"></div>

            </div>

            <div class="stamp-box">

                <div class="stamp-number">6</div>

                <div id="date6" class="stamp-date"></div>

            </div>

        </div>

    </div>

    <!-- ========================================= -->
    <!-- ACTION BUTTON -->
    <!-- ========================================= -->

    <div class="card-action">

        <button
        id="playGameBtn"
        class="play-btn">

            🎮 PLAY GAME

        </button>

    </div>

    <!-- Hidden Firebase Element -->

    <span
    id="countdown"
    style="display:none;">

        --

    </span>
        <!-- ========================================= -->
    <!-- PREMIUM FOOTER -->
    <!-- ========================================= -->

</div>

<!-- ========================================= -->
<!-- BOTTOM NAVIGATION
========================================= -->

    <a

        <img
        src="assets/icons/home.png"

        <span>

            Home

        </span>

    </a>

    <a href="qr.html">

        <img

        <span>
