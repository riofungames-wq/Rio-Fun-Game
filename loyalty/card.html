<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point</title>

<meta
name="theme-color"
content="#304D30">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/style.css">

<link
rel="stylesheet"
href="css/card.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<!-- ================================================= -->
<!-- PREMIUM LOYALTY CARD -->
<!-- ================================================= -->

<div
id="loyaltyCard"
class="loyalty-card theme-male">

<div class="card-glow"></div>

<div class="card-shine"></div>

<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<div class="card-header">

<div class="brand-section">

<img
class="brand-logo"
src="assets/logo/logo.png"
alt="Rio Logo">

<div class="brand-text">

<h2>

RIO MAGGI POINT

</h2>

<p>

Premium Loyalty Card

</p>

</div>

</div>

<div class="owner-section">

<div class="owner-name">

KABiR

</div>

<div
id="mobileNumber"
class="owner-mobile">

📞 Loading...

</div>

<button
id="playGameBtn"
class="play-btn">

<i class="fa-solid fa-gamepad"></i>

<span>

PLAY GAME

</span>

</button>

</div>

</div>

<!-- ================================================= -->
<!-- CUSTOMER PROFILE -->
<!-- ================================================= -->

<div class="customer-section">

<div class="avatar-wrapper">

<div class="avatar-ring"></div>

<img
id="customerPhoto"
src="assets/avatars/male-01.png"
alt="Customer">

</div>

<div class="customer-info">

<h1
id="customerName">

Loading...

</h1>

<p
id="memberId">

ID : -----

</p>

</div>

</div>

<div class="premium-divider"></div>
<!-- ================================================= -->
<!-- STAMP SECTION -->
<!-- ================================================= -->

<div class="stamp-section">

<div class="stamp-title">

Collect 6 Stamps & Get 1 Free Veg Maggi

</div>

<div class="stamp-grid">

<!-- ==================== -->
<!-- Stamp 1 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp1"
class="stamp-circle">

<span>1</span>

</div>

<small
id="date1">

--

</small>

</div>

<!-- ==================== -->
<!-- Stamp 2 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp2"
class="stamp-circle">

<span>2</span>

</div>

<small
id="date2">

--

</small>

</div>

<!-- ==================== -->
<!-- Stamp 3 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp3"
class="stamp-circle">

<span>3</span>

</div>

<small
id="date3">

--

</small>

</div>

<!-- ==================== -->
<!-- Stamp 4 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp4"
class="stamp-circle">

<span>4</span>

</div>

<small
id="date4">

--

</small>

</div>

<!-- ==================== -->
<!-- Stamp 5 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp5"
class="stamp-circle">

<span>5</span>

</div>

<small
id="date5">

--

</small>

</div>

<!-- ==================== -->
<!-- Stamp 6 -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="stamp6"
class="stamp-circle">

<span>6</span>

</div>

<small
id="date6">

--

</small>

</div>

<!-- ==================== -->
<!-- Reward -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="rewardCircle"
class="stamp-circle reward-circle">

<img
src="assets/icons/veg-maggi.png"
alt="Veg Maggi">

</div>

<small>

FREE

</small>

</div>

<!-- ==================== -->
<!-- Happy Emoji -->
<!-- ==================== -->

<div class="stamp-box">

<div
id="happyCircle"
class="stamp-circle happy-circle">

😊

</div>

<small>

HAPPY

</small>

</div>

</div>

</div>
<!-- ================================================= -->
<!-- Hidden Firebase Elements -->
<!-- ================================================= -->

<span
id="countdown"
style="display:none;">

--

</span>

</div>

<!-- ================================================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ================================================= -->

<nav class="bottom-nav">

<a
href="card.html"
class="active">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<a
href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>

QR

</span>

</a>

<a
href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>

History

</span>

</a>

<a
href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>

Review

</span>

</a>

<a
href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

</div>

window.addEventListener("load",()=>{

});
