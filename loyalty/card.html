<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point | Loyalty Card</title>

<link rel="stylesheet" href="css/card.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Announcement -->

<div id="announcementBar" class="announcement">

<i class="fa-solid fa-bullhorn"></i>

<span id="announcementText"></span>

</div>

<!-- Page -->

<div class="page">

<!-- Download Area -->

<div id="downloadArea">

<!-- ATM CARD -->

<div class="premium-card">

<!-- Header -->

<div class="card-header">

<div>

<h2>🍜 Rio Maggi Point</h2>

<p>Premium Loyalty Member</p>

</div>

<div class="owner">

Kabir Owner

</div>

</div>

<!-- Customer -->

<div class="customer-row">

<div class="avatar-frame">

<img
id="customerPhoto"
alt="Customer">

<div id="defaultAvatar"></div>

</div>

<div class="customer-info">

<h3 id="customerName">

Loading...

</h3>

<p id="memberId">

Member ID

</p>

<p id="mobileNumber">

Mobile Number

</p>

</div>

</div>

<!-- Countdown -->

<div class="countdown-box">

<div class="time-box">

<span id="days">00</span>

<label>Days</label>

</div>

<div class="time-box">

<span id="hours">00</span>

<label>Hours</label>

</div>

<div class="time-box">

<span id="minutes">00</span>

<label>Minutes</label>

</div>

<div class="time-box">

<span id="seconds">00</span>

<label>Seconds</label>

</div>

</div>

<!-- Play Game -->

<button id="playGameBtn">

🎮 Play Free Game

</button>

<!-- Stamp -->

<div class="stamp-grid">

<div class="stamp" id="stamp1">1</div>

<div class="stamp" id="stamp2">2</div>

<div class="stamp" id="stamp3">3</div>

<div class="stamp" id="stamp4">4</div>

<div class="stamp" id="stamp5">5</div>

<div class="stamp" id="stamp6">6</div>

<div class="reward" id="rewardStamp">

🍜

</div>

<div class="happy" id="happyStamp">

😊

</div>

</div>

<div id="rewardMessage">

Collect all stamps to unlock your FREE Veg Maggi.

</div>

</div>

</div>

<!-- Download -->

<button id="downloadCard">

<i class="fa-solid fa-download"></i>

Download Card

</button>

</div>

<!-- Navigation -->

<nav class="bottom-nav">

<a href="index.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>QR</span>

</a>

<a href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>History</span>

</a>

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>Feedback</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="module" src="js/card.js"></script>

</body>

</html>
