<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Rio Maggi Point</title>

<link rel="stylesheet"
href="css/card.css">

</head>

<body>

<div class="page">

<!-- ========================= -->
<!-- PREMIUM CARD -->
<!-- ========================= -->

<div
id="loyaltyCard"
class="loyalty-card theme-male">

<!-- Premium Shine -->

<div class="card-shine"></div>

<!-- Top Row -->

<div class="card-top">

<div class="brand">

<div class="brand-logo">

<img
src="assets/icons/logo.png"
alt="Rio">

</div>

<div class="brand-text">

<h2>

RIO MAGGI POINT

</h2>

<p>

Premium Loyalty Member

</p>

</div>

</div>

<div class="premium-chip">

<img
src="assets/icons/chip.png"
alt="Chip">

</div>

</div>

<!-- ========================= -->
<!-- CUSTOMER -->
<!-- ========================= -->

<div class="customer-section">

<div class="avatar-wrapper">

<img

id="customerPhoto"

src="assets/avatars/male.png"

alt="Avatar">

<div class="vip-ring"></div>

</div>

<div class="customer-info">

<h3
id="customerName">

Loading...

</h3>

<p
id="memberId">

ID : -----

</p>

<div class="mobile-row">

<img
src="assets/icons/phone.png"
alt="Phone">

<span
id="ownerNumber">

Loading...

</span>

</div>

</div>

</div>

<!-- ========================= -->
<!-- STAMP AREA -->
<!-- ========================= -->

<div class="stamp-section">

<div class="stamp-title">

Loyalty Progress

</div>

<div class="stamp-row">

<div class="stamp">

<span>1</span>

<small id="date1"></small>

</div>

<div class="stamp">

<span>2</span>

<small id="date2"></small>

</div>

<div class="stamp">

<span>3</span>

<small id="date3"></small>

</div>

<div class="stamp">

<span>4</span>

<small id="date4"></small>

</div>
<div class="stamp">

<span>5</span>

<small id="date5"></small>

</div>

<div class="stamp">

<span>6</span>

<small id="date6"></small>

</div>

</div>

</div>

<!-- ========================= -->
<!-- REWARD -->
<!-- ========================= -->

<div class="reward-section">

<div class="reward-badge">

<img
src="assets/icons/reward.png"
alt="Reward">

<span>

FREE VEG MAGGI

</span>

</div>

<div class="countdown-box">

<img
src="assets/icons/countdown.png"
alt="Countdown">

<span
id="countdown">

--

</span>

</div>

</div>

<!-- ========================= -->
<!-- ACTION -->
<!-- ========================= -->

<div class="action-row">

<button
id="playGameBtn"
class="play-btn">

<img
src="assets/icons/play.png"
alt="Play">

<span>

PLAY GAME

</span>

</button>

</div>

</div>

<!-- ========================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ========================= -->

<nav class="bottom-nav">

<a
href="card.html"
class="active">

<img
src="assets/icons/home.png"
alt="Home">

<span>

Home

</span>

</a>

<a href="qr.html">

<img
src="assets/icons/qr.png"
alt="QR">

<span>

QR

</span>

</a>

<a href="history.html">

<img
src="assets/icons/history.png"
alt="History">

<span>

History

</span>

</a>

<a href="feedback.html">

<img
src="assets/icons/review.png"
alt="Review">

<span>

Review

</span>

</a>

<a href="profile.html">

<img
src="assets/icons/profile.png"
alt="Profile">

<span>

Profile

</span>

</a>

</nav>

</div>

<script
type="module"
src="js/card.js">

</script>

</body>

</html>
