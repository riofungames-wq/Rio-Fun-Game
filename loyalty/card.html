<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/style.css">

<link
rel="stylesheet"
href="css/card.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<div
id="loyaltyCard"
class="loyalty-card male-theme">

<!-- Premium Glow -->

<div class="premium-glow"></div>

<div class="premium-shine"></div>

<!-- =============================== -->
<!-- HEADER -->
<!-- =============================== -->

<div class="card-header">

<div class="brand-left">

<img
src="assets/logo/bowl-logo.png"
class="brand-logo"
alt="Rio">

<div class="brand-text">

<h2>

RIO MAGGI POINT

</h2>

<p>

Premium Loyalty Club

</p>

</div>

</div>

</div>

<!-- =============================== -->
<!-- CUSTOMER -->
<!-- =============================== -->

<div class="customer-section">

<div class="avatar-area">

<div class="avatar-ring"></div>

<img
id="customerPhoto"
src="assets/avatars/male.png"
alt="Customer">

</div>

<div class="customer-details">

<h1
id="customerName">

Loading...

</h1>

<p class="member-title">

PREMIUM MEMBER

</p>

<div class="member-id-box">

<span>

MEMBER ID

</span>

<strong
id="memberId">

RIO-000000000

</strong>

</div>

</div>

</div>

<div class="premium-divider"></div>

<!-- =============================== -->
<!-- SHOP CONTACT -->
<!-- =============================== -->

<div class="shop-contact">

<button
id="callShopBtn"
class="contact-btn">

<i class="fa-solid fa-phone"></i>

CALL

</button>

<button
id="whatsappBtn"
class="contact-btn">

<i class="fa-brands fa-whatsapp"></i>

WHATSAPP

</button>

<button
id="mapBtn"
class="contact-btn">

<i class="fa-solid fa-location-dot"></i>

MAP

</button>

</div>

<div class="premium-divider"></div>
<!-- ===================================== -->
<!-- STAMP SECTION -->
<!-- ===================================== -->

<div class="stamp-section">

    <div class="stamp-heading">

        Collect 6 Stamps & Unlock Your Free Veg Maggi

    </div>

    <div class="stamp-grid">

        <!-- Stamp 1 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp1">

                <span>1</span>

            </div>

            <small id="date1">--</small>

        </div>

        <!-- Stamp 2 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp2">

                <span>2</span>

            </div>

            <small id="date2">--</small>

        </div>

        <!-- Stamp 3 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp3">

                <span>3</span>

            </div>

            <small id="date3">--</small>

        </div>

        <!-- Stamp 4 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp4">

                <span>4</span>

            </div>

            <small id="date4">--</small>

        </div>

        <!-- Stamp 5 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp5">

                <span>5</span>

            </div>

            <small id="date5">--</small>

        </div>

        <!-- Stamp 6 -->

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp6">

                <span>6</span>

            </div>

            <small id="date6">--</small>

        </div>

        <!-- Reward -->

        <div class="stamp-box reward-box">

            <div class="stamp-circle reward-circle">

                <img

                    src="assets/icons/veg-maggi.png"

                    alt="Reward">

            </div>

            <small>

                FREE VEG MAGGI

            </small>

        </div>

        <!-- Happy Mascot -->

        <div class="stamp-box happy-box">

            <div

                class="stamp-circle happy-circle"

                id="happyCircle">

                <img

                    src="assets/mascot/rio-male.png"

                    alt="Mascot">

            </div>

            <small>

                HAPPY

            </small>

        </div>

    </div>

</div>

<!-- Hidden Countdown -->

<span

id="countdown"

style="display:none;">

--

</span>
<!-- ===================================== -->
<!-- BOTTOM NAVIGATION -->
<!-- ===================================== -->

</div>

<nav class="bottom-nav">

    <a
        href="card.html"
        class="active">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </a>

    <a href="qr.html">

        <i class="fa-solid fa-qrcode"></i>

        <span>QR</span>

    </a>

    <a href="history.html">

        <i class="fa-solid fa-clock-rotate-left"></i>

        <span>History</span>

    </a>

    <a href="feedback.html">

        <i class="fa-solid fa-heart"></i>

        <span>Review</span>

    </a>

    <a href="profile.html">

        <i class="fa-solid fa-user"></i>

        <span>Profile</span>

    </a>

</nav>

</div>

<!-- ===================================== -->
<!-- FIREBASE -->
<!-- ===================================== -->

<script
type="module"
src="js/card.js">
</script>

<!-- ===================================== -->
<!-- SERVICE WORKER -->
<!-- ===================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./service-worker.js");

    });

}

</script>

</body>

</html>
