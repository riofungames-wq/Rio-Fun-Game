<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Rio Maggi Point | Loyalty Card
</title>

<meta name="theme-color"
content="#1b1b1b">

<link rel="manifest"
href="manifest.json">

<link rel="icon"
href="assets/logo/favicon.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/card.css">

</head>

<body>

<div class="page">

<div
id="loyaltyCard"
class="atm-card male-theme">

<!-- Premium Background -->

<div class="card-glow"></div>

<div class="card-shine"></div>

<!-- ========================= -->
<!-- TOP LOGO -->
<!-- ========================= -->

<div class="card-top">

<img
src="assets/logo/bowl-logo.png"
class="bowl-logo"
alt="Rio Bowl">

<h2>
Rio Maggi Point
</h2>

</div>

<!-- ========================= -->
<!-- CUSTOMER SECTION -->
<!-- ========================= -->

<div class="customer-row">

<div class="customer-photo">

<img
id="customerPhoto"
src="assets/avatars/default.png"
alt="Customer">

</div>

<div class="customer-info">

<h3
id="customerName">

Loading...

</h3>

<p
id="memberId">

RIO-000000000

</p>

</div>

<button
id="playGameBtn"
class="play-btn">

<i class="fa-solid fa-play"></i>

</button>

</div>
<!-- ========================= -->
<!-- STAMP AREA -->
<!-- ========================= -->

<div class="stamp-title">

Collect 6 Stamps • Get 1 FREE Veg Maggi

</div>

<div class="stamp-grid">

<div class="stamp-item">

<div class="stamp-circle" id="stamp1">

<span>1</span>

</div>

<small id="date1">--</small>

</div>

<div class="stamp-item">

<div class="stamp-circle" id="stamp2">

<span>2</span>

</div>

<small id="date2">--</small>

</div>

<div class="stamp-item">

<div class="stamp-circle" id="stamp3">

<span>3</span>

</div>

<small id="date3">--</small>

</div>

<div class="stamp-item">

<div class="stamp-circle" id="stamp4">

<span>4</span>

</div>

<small id="date4">--</small>

</div>

<div class="stamp-item">

<div class="stamp-circle" id="stamp5">

<span>5</span>

</div>

<small id="date5">--</small>

</div>

<div class="stamp-item">

<div class="stamp-circle" id="stamp6">

<span>6</span>

</div>

<small id="date6">--</small>

</div>

<!-- FREE VEG MAGGI -->

<div class="stamp-item reward-item">

<div class="reward-circle">

<img
src="assets/icons/veg-maggi.png"
alt="Free Veg Maggi">

</div>

<small>

FREE

</small>

</div>

<!-- HAPPY MASCOT -->

<div class="stamp-item mascot-item">

<div class="mascot-circle">

<img
id="happyMascot"
src="assets/mascot/rio-male.png"
alt="Happy Rio">

</div>

<small>

HAPPY

</small>

</div>

</div>

<!-- ========================= -->
<!-- PREMIUM MESSAGE -->
<!-- ========================= -->

<div class="premium-message">

<i class="fa-solid fa-gift"></i>

Complete all 6 stamps to unlock your

<b>FREE VEG MAGGI</b>

</div>
<!-- ========================= -->
<!-- QUICK ACTIONS -->
<!-- ========================= -->

<div class="quick-actions">

<button
id="callShopBtn"
class="action-btn">

<i class="fa-solid fa-phone"></i>

<span>Call</span>

</button>

<button
id="whatsappBtn"
class="action-btn">

<i class="fa-brands fa-whatsapp"></i>

<span>WhatsApp</span>

</button>

<button
id="mapBtn"
class="action-btn">

<i class="fa-solid fa-location-dot"></i>

<span>Map</span>

</button>

</div>

</div>
<!-- END ATM CARD -->

<!-- ========================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ========================= -->

<nav class="bottom-nav">

<a
href="card.html"
class="active">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a
href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>QR</span>

</a>

<a
href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>History</span>

</a>

<a
href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>Review</span>

</a>

<a
href="profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script
type="module"
src="js/card.js">
</script>

<!-- ========================= -->
<!-- SERVICE WORKER -->
<!-- ========================= -->

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>

</body>

</html>
