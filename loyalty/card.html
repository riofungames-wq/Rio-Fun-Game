     <!-- =========================================

     CATEGORY CLICK + ITEM LIST + PNG POPUP
========================================= -->


<script>


/* =========================================
   HTML ELEMENTS
========================================= */

const categoryGrid =

    document.getElementById(

        "menuCategoryGrid"

    );


const categoryDetailSection =

    document.getElementById(

        "categoryDetailSection"

    );


const categoryItemsContainer =

    document.getElementById(

        "categoryItemsContainer"

    );


const categoryDetailTitle =

    document.getElementById(

        "categoryDetailTitle"

    );


const categoryDetailSubtitle =

    document.getElementById(

        "categoryDetailSubtitle"

    );


const categoryDetailIcon =

    document.getElementById(

        "categoryDetailIcon"

    );


const backToCategoriesBtn =

    document.getElementById(

        "backToCategoriesBtn"

    );



/* =========================================
   OPEN CATEGORY
========================================= */

function openCategory(

    categoryId

) {


    const category =

        menuData[

            categoryId

        ];


    if (

        !category

    ) {

        return;

    }



    /* =====================================
       UPDATE CATEGORY HEADER
    ===================================== */

    categoryDetailTitle.textContent =

        category.title;


    categoryDetailSubtitle.textContent =

        category.subtitle;


    categoryDetailIcon.innerHTML = `

        <i class="fa-solid ${category.icon}"></i>

    `;



    /* =====================================
       CLEAR OLD ITEMS
    ===================================== */

    categoryItemsContainer.innerHTML = "";



    /* =====================================
       CREATE ITEM CARDS
    ===================================== */

    category.items.forEach(

        (

            item,

            index

        ) => {


            const itemCard =

                document.createElement(

                    "button"

                );


            itemCard.type =

                "button";


            itemCard.className =

                "category-item-card app-card";



            /* =================================
               ITEM IMAGE PATH
            ================================= */

            const itemImage =

                category.image;



            /* =================================
               PRICE HTML
            ================================= */

            let priceHTML = "";



            if (

                item.half &&

                item.full

            ) {


                priceHTML = `

                    <div class="item-size-price">

                        <div>

                            <span>

                                Half

                            </span>

                            <strong>

                                ${item.half}

                            </strong>

                        </div>

                        <div>

                            <span>

                                Full

                            </span>

                            <strong>

                                ${item.full}

                            </strong>

                        </div>

                    </div>

                `;


            }


            else {


                priceHTML = `

                    <div class="single-item-price">

                        ${item.price}

                    </div>

                `;


            }



            /* =================================
               ITEM CARD HTML
            ================================= */

            itemCard.innerHTML = `

                <div class="category-item-image-wrapper">

                    <img

                        src="${itemImage}"

                        alt="${item.name}"

                        class="category-item-image"

                        loading="lazy"

                    >

                    <div class="category-item-image-overlay">

                        <i class="fa-solid fa-expand"></i>

                        <span>

                            View

                        </span>

                    </div>

                </div>


                <div class="category-item-info">

                    <h3>

                        ${item.name}

                    </h3>

                    ${priceHTML}

                </div>

            `;



            /* =================================
               ITEM CLICK
            ================================= */

            itemCard.addEventListener(

                "click",

                () => {


                    openItemPopup(

                        category,

                        item

                    );


                }

            );



            /* =================================
               STAGGERED ANIMATION
            ================================= */

            itemCard.style.animationDelay =

                `${index * 0.06}s`;



            categoryItemsContainer.appendChild(

                itemCard

            );


        }

    );



    /* =====================================
       HIDE CATEGORY GRID
    ===================================== */

    categoryGrid.style.display =

        "none";



    /* =====================================
       SHOW DETAIL SECTION
    ===================================== */

    categoryDetailSection.style.display =

        "block";



    /* =====================================
       SCROLL TO DETAIL
    ===================================== */

    categoryDetailSection.scrollIntoView({

        behavior:
            "smooth",

        block:
            "start"

    });


}



/* =========================================
   CATEGORY CARD CLICK EVENTS
========================================= */

document

    .querySelectorAll(

        ".menu-category-card"

    )

    .forEach(

        (

            categoryCard

        ) => {


            categoryCard.addEventListener(

                "click",

                () => {


                    const categoryId =

                        categoryCard.dataset.category;


                    openCategory(

                        categoryId

                    );


                }

            );


        }

    );



/* =========================================
   BACK TO CATEGORY BUTTON
========================================= */

backToCategoriesBtn.addEventListener(

    "click",

    () => {


        categoryDetailSection.style.display =

            "none";


        categoryGrid.style.display =

            "grid";


        categoryGrid.scrollIntoView({

            behavior:
                "smooth",

            block:
                "start"

        });


    }

);



/* =========================================
   CREATE ITEM POPUP
========================================= */

const itemPopup =

    document.createElement(

        "div"

    );


itemPopup.className =

    "menu-item-popup";


itemPopup.id =

    "menuItemPopup";


itemPopup.innerHTML = `

    <div class="menu-popup-backdrop"></div>


    <div class="menu-popup-card">


        <button

            type="button"

            class="menu-popup-close"

            id="menuPopupClose">

        <div class="menu-popup-image-wrapper">

                id="popupItemImage"

                src=""

                alt="Menu Item"

            >


        </div>



        <div class="menu-popup-content">

                class="menu-popup-category"

                id="popupItemCategory">

            <h2

                id="popupItemName">

                Menu Item

            </h2>



            <div

document.body.appendChild(

/* =========================================
   POPUP ELEMENTS
========================================= */

const popupItemImage =

    document.getElementById(

        "popupItemImage"

    );


const popupItemCategory =

    document.getElementById(

        "popupItemCategory"

    );


const popupItemName =

    document.getElementById(

        "popupItemName"

    );


const popupItemPrice =

    document.getElementById(

        "popupItemPrice"

    );


const menuPopupClose =

    document.getElementById(

        "menuPopupClose"

    );


const menuPopupDone =

    document.getElementById(

        "menuPopupDone"

    );


const menuPopupBackdrop =

    itemPopup.querySelector(

        ".menu-popup-backdrop"

    );



/* =========================================
   OPEN ITEM POPUP
========================================= */

function openItemPopup(

    category,

    item

) {


    popupItemImage.src =

        category.image;


    popupItemImage.alt =

        item.name;


    popupItemCategory.textContent =

        category.title;


    popupItemName.textContent =

        item.name;



    if (

        item.half &&

        item.full

    ) {


        popupItemPrice.innerHTML = `

            <div class="popup-price-option">

                <span>

                    Half

                </span>

                <strong>

                    ${item.half}

                </strong>

            </div>


            <div class="popup-price-option">

                <span>

                    Full

                </span>

                <strong>

                    ${item.full}

                </strong>

            </div>

        `;


    }


    else {


        popupItemPrice.innerHTML = `

            <div class="popup-price-single">

                ${item.price}

            </div>

        `;


    }



    itemPopup.classList.add(

        "show"

    );


    document.body.classList.add(

        "menu-popup-open"

    );


}



/* =========================================
   CLOSE ITEM POPUP
========================================= */

function closeItemPopup() {


    itemPopup.classList.remove(

        "show"

    );


    document.body.classList.remove(

        "menu-popup-open"

    );


}



/* =========================================
   CLOSE BUTTON
========================================= */

menuPopupClose.addEventListener(

    "click",

    closeItemPopup

);



/* =========================================
   DONE BUTTON
========================================= */

menuPopupDone.addEventListener(

    "click",

    closeItemPopup

);



/* =========================================
   BACKDROP CLICK
========================================= */

menuPopupBackdrop.addEventListener(

    "click",

    closeItemPopup

);



/* =========================================
   ESCAPE KEY
========================================= */

document.addEventListener(

    "keydown",

    (

        event

    ) => {


        if (

            event.key ===

            "Escape"

        ) {


            closeItemPopup();


        }


    }

);


</script>

    )

    .forEach(

        (

            card

        ) => {


            card.setAttribute(

                "aria-label",

                "Open " +

                card.dataset.category +

                " menu"

            );


        }

    );



/* =========================================
   IMAGE ERROR FALLBACK
========================================= */

document

    .querySelectorAll(

        "img"

    )

    .forEach(

        (

            image

        ) => {


            image.addEventListener(

                "error",

                () => {


                    image.classList.add(

                        "image-load-error"

                    );


                }

            );


        }

    );



/* =========================================
   PREVENT DOUBLE TAP ZOOM
   ON MENU CATEGORY BUTTONS
========================================= */

document

    .querySelectorAll(

        ".menu-category-card"

    )

    .forEach(

        (

            card

        ) => {


            card.addEventListener(

                "touchstart",

                () => {


                    card.classList.add(

                        "menu-card-touching"

                    );


                },

                {

                    passive:
                        true

                }

            );


            card.addEventListener(

                "touchend",

                () => {


                    setTimeout(

                        () => {


                            card.classList.remove(

                                "menu-card-touching"

                            );


                        },

                        150

                    );


                },

                {

                    passive:
                        true

                }

            );


        }

    );



/* =========================================
   PAGE READY
========================================= */

document.addEventListener(

    "DOMContentLoaded",

    () => {


        document.body.classList.add(

            "menu-page-ready"

        );


    }

);


</script>
