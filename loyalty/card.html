<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point | Premium Loyalty Card</title>

<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/card.css">

</head>

<body>

<div class="dashboard">

<!-- ========================= -->
<!-- PREMIUM ATM CARD -->
<!-- ========================= -->

<div id="loyaltyCard" class="premium-card">

<div class="card-glow"></div>

<div class="card-shine"></div>

<!-- TOP -->

<div class="card-top">

<div class="brand">

<img
id="bowlLogo"
src="assets/logo/bowl-logo.png"
alt="Rio Bowl">

<h1>

RIO MAGGI POINT

</h1>

</div>

</div>

<!-- PROFILE -->

<div class="profile-row">

<div class="profile-left">

<div class="profile-photo">

<img
id="customerPhoto"
src="assets/avatars/male.png"
alt="Customer">

</div>

<div class="profile-info">

<h2 id="customerName">

Loading...

</h2>

<p id="memberId">

RIO-000000

</p>

<div class="gold-strip">

<span>

LOYALTY MEMBER

</span>

</div>

</div>

</div>

<div class="profile-right">

<button id="playGameBtn">

<i class="fa-solid fa-play"></i>

PLAY FREE GAME

</button>

</div>

</div>
<!-- ========================= -->
<!-- PREMIUM REWARD STRIP -->
<!-- ========================= -->

<div class="reward-strip">

    <span>

        Collect 6 Stamps • Unlock 1 FREE VEG MAGGI

    </span>

</div>

<!-- ========================= -->
<!-- STAMP SECTION -->
<!-- ========================= -->

<div class="stamp-section">

    <div class="stamp-row">

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp1"></div>

            <small id="date1">--</small>

        </div>

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp2"></div>

            <small id="date2">--</small>

        </div>

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp3"></div>

            <small id="date3">--</small>

        </div>

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp4"></div>

            <small id="date4">--</small>

        </div>

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp5"></div>

            <small id="date5">--</small>

        </div>

        <div class="stamp-box">

            <div class="stamp-circle" id="stamp6"></div>

            <small id="date6">--</small>

        </div>

        <!-- FREE VEG MAGGI -->

        <div class="stamp-box reward-slot">

            <img
            src="assets/icons/veg-maggi.png"
            id="rewardVegMaggi"
            alt="Reward">

        </div>

        <!-- HAPPY MASCOT -->

        <div class="stamp-box mascot-slot">

            <img
            src="assets/mascot/rio-male.png"
            id="happyMascot"
            alt="Happy">

        </div>

    </div>

</div>
<!-- ========================= -->
<!-- END PREMIUM CARD -->
<!-- ========================= -->

</div>

<!-- ========================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ========================= -->

<nav class="bottom-nav">

    <a href="card.html" class="active">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </a>

    <a href="qr.html">

        <i class="fa-solid fa-qrcode"></i>

        <span>QR</span>

    </a>

    <a href="history.html">

        <i class="fa-solid fa-clock-rotate-left"></i>

        <span>History</span>

    </a>

    <a href="feedback.html">

        <i class="fa-solid fa-heart"></i>

        <span>Review</span>

    </a>

    <a href="profile.html">

        <i class="fa-solid fa-user"></i>

        <span>Profile</span>

    </a>

</nav>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script
type="module"
src="js/card.js">
</script>

<!-- ========================= -->
<!-- SERVICE WORKER -->
<!-- ========================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./service-worker.js");

    });

}

</script>

</body>
</html>
