<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rio Maggi Point</title>

<link rel="stylesheet" href="css/card.css">

</head>

<body>

<div class="page">

    <!-- ATM CARD -->

    <div id="loyaltyCard" class="loyalty-card">

        <!-- Owner -->

        <div class="owner-area">

            <div class="owner-name">
                KABiR
            </div>

            <div class="owner-mobile">
                <span>🟢</span>
                <span id="ownerNumber">7987827979</span>
            </div>

        </div>

        <!-- Left -->

        <div class="left-area">

            <div class="crown">
                👑
            </div>

            <div class="avatar-box">

                <img
                id="customerPhoto"
                src=""
                alt="Avatar">

            </div>

        </div>

        <!-- Center -->

        <div class="center-area">

            <div class="brand">

                <div class="brand-top">

                    <span class="rio">
                        Rio
                    </span>

                    <span class="bowl">
                        🍜
                    </span>

                </div>

                <div class="brand-middle">
                    MAGGI POINT
                </div>

                <div class="brand-bottom">
                    Premium Loyalty Member
                </div>

            </div>

            <div
            id="customerName"
            class="customer-name">
                Rahul Kumar
            </div>

            <div
            id="memberId"
            class="member-id">
                ID : RMP-000001
            </div>

        </div>

        <!-- Bottom -->

        <div class="bottom-area">

            <div class="stamp-row">

                <div class="stamp">
                    <span>1</span>
                    <small id="date1"></small>
                </div>

                <div class="stamp">
                    <span>2</span>
                    <small id="date2"></small>
                </div>

                <div class="stamp">
                    <span>3</span>
                    <small id="date3"></small>
                </div>

                <div class="stamp">
                    <span>4</span>
                    <small id="date4"></small>
                </div>

                <div class="stamp">
                    <span>5</span>
                    <small id="date5"></small>
                </div>

                <div class="stamp">
                    <span>6</span>
                    <small id="date6"></small>
                </div>

                <div class="reward-stamp">
                    FREE VEG MAGGI
                </div>

                <div class="emoji-stamp">
                    😊
                </div>

            </div>

            <button
            id="playGameBtn"
            class="play-btn">

                🎮 PLAY GAME

            </button>

        </div>

    </div>

    <!-- Navigation -->

    <nav class="bottom-nav">

        <a href="card.html">
            🏠
            <span>Home</span>
        </a>

        <a href="qr.html">
            📷
            <span>QR</span>
        </a>

        <a href="history.html">
            🕒
            <span>History</span>
        </a>

        <a href="feedback.html">
            ❤️
            <span>Review</span>
        </a>

        <a href="profile.html">
            👤
            <span>Profile</span>
        </a>

    </nav>

</div>

<script type="module" src="js/card.js"></script>

</body>
</html>
