===================================== -->

type="module"

<!-- =====================================
     SERVICE WORKER
===================================== -->

<script>

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(

        "load",

        () => {

            navigator.serviceWorker.register(

                "./service-worker.js"

            )

            .then(

                registration => {

                    console.log(

                        "Rio Maggi Point Service Worker Registered:",

                        registration.scope

                    );

                }

            )

            .catch(

                error => {

                    console.error(

                        "Service Worker Registration Failed:",

                        error

                    );

                }

            );

        }

    );

}

</script>
