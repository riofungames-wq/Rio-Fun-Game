<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Rio Maggi Point • Review
</title>

<meta
name="theme-color"
content="#111111">

<meta
name="description"
content="Rio Maggi Point Premium Customer Review">

<link
rel="manifest"
href="manifest.json">

<link
rel="icon"
href="favicon.ico">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- COMMON LAYOUT -->

<link
rel="stylesheet"
href="css/common.css">

<!-- PAGE CSS -->

<link
rel="stylesheet"
href="css/feedback.css">

</head>


<body>


<!-- =====================================
     MAIN PAGE
===================================== -->

<div class="page">


<!-- =====================================
     FEEDBACK CARD
===================================== -->

<div class="feedback-card app-card">


<div class="card-glow"></div>

<div class="card-shine"></div>


<!-- =====================================
     HEADER
===================================== -->

<header class="feedback-header">

<h1>

RIO MAGGI POINT

</h1>


<p>

Premium Customer Review

</p>

</header>


<!-- =====================================
     CUSTOMER SECTION
===================================== -->

<section class="customer-section">


<div class="avatar-frame">

<img

id="feedbackPhoto"

src="assets/avatars/male.png"

alt="Customer">

</div>


<div

id="feedbackName"

class="customer-name">

Loading...

</div>


<div class="customer-id">

ID :

<span id="feedbackMember">

RIO-000000

</span>

</div>


</section>


<!-- =====================================
     RATING SECTION
===================================== -->

<section class="rating-box">


<h2>

How Was Your Maggi?

</h2>


<div class="star-rating">


<i
class="fa-regular fa-star star"
data-rate="1">
</i>


<i
class="fa-regular fa-star star"
data-rate="2">
</i>


<i
class="fa-regular fa-star star"
data-rate="3">
</i>


<i
class="fa-regular fa-star star"
data-rate="4">
</i>


<i
class="fa-regular fa-star star"
data-rate="5">
</i>


</div>


<p id="ratingText">

Tap A Star

</p>


</section>


<!-- =====================================
     PART 1 END
===================================== -->
  <!-- =====================================
     FEEDBACK.HTML - PART 2
     EMOTION + REVIEW + SUBMIT
===================================== -->


<!-- =====================================
     EMOTION SECTION
===================================== -->

<section class="emoji-box">


<h2>

How Do You Feel?

</h2>


<div class="emoji-list">


<button
class="emoji-btn"
type="button">

😍

</button>


<button
class="emoji-btn"
type="button">

😊

</button>


<button
class="emoji-btn"
type="button">

😋

</button>


<button
class="emoji-btn"
type="button">

🤩

</button>


<button
class="emoji-btn"
type="button">

🥰

</button>


</div>


</section>


<!-- =====================================
     REVIEW TEXT SECTION
===================================== -->

<section class="review-box">


<h2>

Write Your Review

</h2>


<textarea

id="reviewText"

maxlength="300"

placeholder="Tell us about your Maggi experience today...">

</textarea>


<div class="character-count">


<span id="charCount">

0

</span>


/300


</div>


</section>


<!-- =====================================
     SUBMIT FEEDBACK
===================================== -->

<section class="submit-box">


<button

id="submitFeedback"

class="submit-btn"

type="button">


<i class="fa-solid fa-paper-plane"></i>


Submit Feedback


</button>


</section>


<!-- =====================================
     THANK YOU MESSAGE
===================================== -->

<section

id="thankYouBox"

class="thankyou-box"

style="display:none;">


<h2>

🎉 Thank You!

</h2>


<p>

Your feedback has been submitted successfully.

</p>


</section>


<!-- =====================================
     NAVIGATION SAFE SPACE
===================================== -->

<div class="nav-space"></div>


<!-- =====================================
     PART 2 END
===================================== -->
  <!-- =====================================
     FEEDBACK.HTML - PART 3 OF 3
     BOTTOM NAVIGATION + SCRIPTS
     FINAL PART
===================================== -->

     BOTTOM NAVIGATION
===================================== -->

<a href="card.html">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<i class="fa-solid fa-qrcode"></i>

<span>

QR

<span>

class="active">

<i class="fa-solid fa-heart"></i>

<span>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

</nav>


</div>

</div>


<!-- =====================================
     FEEDBACK JAVASCRIPT
===================================== -->

<script

type="module"

src="js/feedback.js">

</script>


<!-- =====================================
     SERVICE WORKER
===================================== -->

<script>

if(

"serviceWorker" in navigator

){

window.addEventListener(

"load",

async()=>{


try{


await navigator.serviceWorker.register(

"./service-worker.js"

);


console.log(

"Service Worker Registered"

);


}


catch(error){


console.error(

"Service Worker Registration Failed:",

error

);


}


}

);

}


</script>


<!-- =====================================
     FEEDBACK.HTML END
===================================== -->

</body>

</html>
