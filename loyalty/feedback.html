<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         RIO MAGGI POINT
         FEEDBACK.HTML
         PREMIUM CUSTOMER REVIEW PAGE
         PART 1/3
         RESPONSIVE:
         MOBILE / TABLET / LAPTOP / DESKTOP
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        Rio Maggi Point • Review
    </title>


    <!-- =====================================================
         SEO / PWA
    ====================================================== -->

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="Rio Maggi Point Premium Customer Review"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        href="favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         COMMON CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/common.css"
    >


    <!-- =====================================================
         FEEDBACK PAGE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/feedback.css"
    >


    <!-- =====================================================
         FEEDBACK PAGE PREMIUM BASE STYLE
    ====================================================== -->

    <style>

        /* =================================================
           GLOBAL RESET
        ================================================= */

        *,
        *::before,
        *::after {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        /* =================================================
           ROOT VARIABLES
        ================================================= */

        :root {

            --black:
                #111111;

            --black-soft:
                #1a1a1a;

            --black-card:
                #202020;

            --red:
                #c62828;

            --red-dark:
                #8f1515;

            --red-light:
                #e53935;

            --gold:
                #ffd54f;

            --gold-dark:
                #d19b4a;

            --cream:
                #fff8e7;

            --cream-soft:
                #fffdf5;

            --text-dark:
                #241c1c;

            --text-muted:
                #75645c;

            --white:
                #ffffff;

            --border-light:
                rgba(
                    209,
                    155,
                    74,
                    .45
                );

        }


        /* =================================================
           HTML
        ================================================= */

        html {

            width: 100%;

            min-height: 100%;

            scroll-behavior: smooth;

            -webkit-text-size-adjust: 100%;

        }


        /* =================================================
           BODY
        ================================================= */

        body {

            width: 100%;

            min-height: 100vh;

            margin: 0;

            padding: 0;

            font-family:
                'Poppins',
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2a0f0f 0%,
                    #111111 38%,
                    #080808 100%
                );

            color:
                var(--text-dark);

            overflow-x: hidden;

        }


        /* =================================================
           MAIN PAGE
        ================================================= */

        .page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            padding:
                24px
                20px
                120px;

            display: flex;

            justify-content: center;

            align-items: flex-start;

        }


        /* =================================================
           BACKGROUND PREMIUM GLOW
        ================================================= */

        .page::before {

            content: "";

            position: fixed;

            top: -180px;

            left: 50%;

            width: 560px;

            height: 560px;

            transform:
                translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(
                        198,
                        40,
                        40,
                        .20
                    ) 0%,
                    rgba(
                        198,
                        40,
                        40,
                        .06
                    ) 42%,
                    transparent 72%
                );

            pointer-events: none;

            z-index: 0;

        }


        /* =================================================
           FEEDBACK CARD
        ================================================= */

        .feedback-card {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            overflow: hidden;

            border:
                1px solid
                var(--border-light);

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    #fff8e7,
                    #f8e8c4
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    .40
                );

            animation:
                feedbackCardEnter
                .7s
                ease
                both;

        }


        /* =================================================
           CARD ENTRY ANIMATION
        ================================================= */

        @keyframes feedbackCardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(28px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =================================================
           CARD GLOW
        ================================================= */

        .card-glow {

            position: absolute;

            top: -120px;

            right: -120px;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        198,
                        40,
                        40,
                        .22
                    ),
                    transparent 70%
                );

            pointer-events: none;

            z-index: 0;

        }


        /* =================================================
           CARD SHINE
        ================================================= */

        .card-shine {

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(
                        255,
                        255,
                        255,
                        .18
                    ),
                    transparent
                );

            transform:
                skewX(-18deg);

            pointer-events: none;

            z-index: 4;

            animation:
                cardShineMove
                6s
                ease-in-out
                infinite;

        }


        @keyframes cardShineMove {

            0% {

                left:
                    -120%;

            }

            35% {

                left:
                    130%;

            }

            100% {

                left:
                    130%;

            }

        }


        /* =================================================
           FEEDBACK HEADER
        ================================================= */

        .feedback-header {

            position: relative;

            z-index: 2;

            padding:
                30px
                24px
                26px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #151515,
                    #241010
                );

            border-bottom:
                1px solid
                rgba(
                    198,
                    40,
                    40,
                    .45
                );

        }


        /* =================================================
           HEADER TITLE
        ================================================= */

        .feedback-header h1 {

            font-size:
                clamp(
                    22px,
                    5vw,
                    32px
                );

            line-height:
                1.2;

            font-weight:
                800;

            letter-spacing:
                1.5px;

            color:
                var(--white);

        }


        /* =================================================
           HEADER SUBTITLE
        ================================================= */

        .feedback-header p {

            margin-top:
                8px;

            font-size:
                clamp(
                    12px,
                    2.5vw,
                    15px
                );

            line-height:
                1.5;

            font-weight:
                400;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .70
                );

        }


        /* =================================================
           CUSTOMER SECTION
        ================================================= */

        .customer-section {

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                28px
                20px
                24px;

            text-align: center;

        }


        /* =================================================
           AVATAR FRAME
        ================================================= */

        .avatar-frame {

            position: relative;

            width: 96px;

            height: 96px;

            padding: 4px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    var(--red),
                    var(--gold)
                );

            box-shadow:
                0 12px 30px
                rgba(
                    198,
                    40,
                    40,
                    .28
                );

            animation:
                avatarFloat
                3s
                ease-in-out
                infinite;

        }


        /* =================================================
           AVATAR ANIMATION
        ================================================= */

        @keyframes avatarFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-5px);

            }

        }


        /* =================================================
           AVATAR IMAGE
        ================================================= */

        .avatar-frame img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            background:
                var(--cream);

            border:
                3px solid
                var(--cream);

        }


        /* =================================================
           CUSTOMER NAME
        ================================================= */

        .customer-name {

            margin-top:
                14px;

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            line-height:
                1.3;

            font-weight:
                800;

            color:
                var(--black);

        }


        /* =================================================
           CUSTOMER ID
        ================================================= */

        .customer-id {

            margin-top:
                5px;

            font-size:
                11px;

            line-height:
                1.5;

            font-weight:
                600;

            letter-spacing:
                .6px;

            color:
                var(--text-muted);

        }


        .customer-id span {

            color:
                var(--red);

        }


        /* =================================================
           RATING BOX
        ================================================= */

        .rating-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

            padding:
                24px
                18px;

            text-align:
                center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .62
                );

            border:
                2px solid
                var(--border-light);

            border-radius:
                20px;

            box-shadow:
                0 10px 25px
                rgba(
                    0,
                    0,
                    0,
                    .08
                );

        }


        /* =================================================
           RATING TITLE
        ================================================= */

        .rating-box h2 {

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            line-height:
                1.3;

            font-weight:
                800;

            color:
                var(--black);

        }


        /* =================================================
           STAR RATING
        ================================================= */

        .star-rating {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                10px;

            margin-top:
                17px;

        }


        /* =================================================
           STAR
        ================================================= */

        .star {

            width:
                42px;

            height:
                42px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                12px;

            font-size:
                27px;

            color:
                var(--gold-dark);

            cursor:
                pointer;

            transition:
                transform
                .25s
                ease,
                color
                .25s
                ease,
                background
                .25s
                ease;

        }


        /* =================================================
           STAR HOVER
        ================================================= */

        .star:hover {

            transform:
                translateY(-4px)
                scale(1.08);

            color:
                var(--red);

            background:
                rgba(
                    198,
                    40,
                    40,
                    .08
                );

        }


        /* =================================================
           ACTIVE STAR
        ================================================= */

        .star.active {

            color:
                var(--red);

            transform:
                scale(1.08);

        }


        /* =================================================
           RATING TEXT
        ================================================= */

        #ratingText {

            min-height:
                22px;

            margin-top:
                10px;

            font-size:
                12px;

            line-height:
                1.5;

            font-weight:
                600;

            color:
                var(--text-muted);

        }


        /* =================================================
           MOBILE
           480px AND BELOW
        ================================================= */

        @media (
            max-width: 480px
        ) {

            .page {

                padding:
                    12px
                    10px
                    110px;

            }


            .feedback-card {

                border-radius:
                    20px;

            }


            .feedback-header {

                padding:
                    22px
                    16px
                    20px;

            }


            .feedback-header h1 {

                font-size:
                    21px;

                letter-spacing:
                    1px;

            }


            .feedback-header p {

                font-size:
                    11px;

            }


            .customer-section {

                padding:
                    24px
                    16px
                    20px;

            }


            .avatar-frame {

                width:
                    82px;

                height:
                    82px;

            }


            .customer-name {

                font-size:
                    18px;

            }


            .rating-box {

                margin:
                    0
                    12px
                    14px;

                padding:
                    20px
                    12px;

                border-radius:
                    17px;

            }


            .rating-box h2 {

                font-size:
                    17px;

            }


            .star-rating {

                gap:
                    4px;

            }


            .star {

                width:
                    39px;

                height:
                    39px;

                font-size:
                    24px;

            }

        }


        /* =================================================
           VERY SMALL MOBILE
           360px AND BELOW
        ================================================= */

        @media (
            max-width: 360px
        ) {

            .page {

                padding-left:
                    7px;

                padding-right:
                    7px;

            }


            .feedback-header {

                padding:
                    19px
                    12px;

            }


            .feedback-header h1 {

                font-size:
                    19px;

            }


            .avatar-frame {

                width:
                    76px;

                height:
                    76px;

            }


            .rating-box {

                margin-left:
                    9px;

                margin-right:
                    9px;

            }


            .star-rating {

                gap:
                    2px;

            }


            .star {

                width:
                    36px;

                height:
                    36px;

                font-size:
                    22px;

            }

        }


        /* =================================================
           TABLET
           481px - 1024px
        ================================================= */

        @media (
            min-width: 481px
        )
        and (
            max-width: 1024px
        ) {

            .page {

                padding:
                    30px
                    24px
                    125px;

            }


            .feedback-card {

                max-width:
                    720px;

                border-radius:
                    26px;

            }


            .feedback-header {

                padding:
                    30px;

            }


            .customer-section {

                padding:
                    32px
                    24px
                    28px;

            }


            .rating-box {

                margin:
                    0
                    24px
                    24px;

            }

        }


        /* =================================================
           LAPTOP
           1025px - 1440px
        ================================================= */

        @media (
            min-width: 1025px
        )
        and (
            max-width: 1440px
        ) {

            .page {

                padding:
                    38px
                    30px
                    135px;

            }


            .feedback-card {

                max-width:
                    780px;

            }

        }


        /* =================================================
           LARGE DESKTOP
           1441px+
        ================================================= */

        @media (
            min-width: 1441px
        ) {

            .page {

                padding:
                    45px
                    30px
                    145px;

            }


            .feedback-card {

                max-width:
                    820px;

            }

        }


        /* =================================================
           REDUCED MOTION
        ================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;

                transition-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN FEEDBACK PAGE
    ===================================================== -->

    <main class="page">


        <!-- =================================================
             PREMIUM FEEDBACK CARD
        ================================================= -->

        <div class="feedback-card app-card">


            <!-- =================================================
                 DECORATIVE EFFECTS
            ================================================= -->

            <div
                class="card-glow"
                aria-hidden="true">
            </div>


            <div
                class="card-shine"
                aria-hidden="true">
            </div>


            <!-- =================================================
                 FEEDBACK HEADER
            ================================================= -->

            <header class="feedback-header">

                <h1>
                    RIO MAGGI POINT
                </h1>

                <p>
                    Premium Customer Review
                </p>

            </header>


            <!-- =================================================
                 CUSTOMER SECTION
            ================================================= -->

            <section
                class="customer-section"
                aria-label="Customer Information">


                <div class="avatar-frame">

                    <img
                        id="feedbackPhoto"
                        src="assets/avatars/male.png"
                        alt="Customer Profile Photo"
                    >

                </div>


                <div
                    id="feedbackName"
                    class="customer-name"
                >
                    Loading...
                </div>


                <div class="customer-id">

                    ID :

                    <span id="feedbackMember">
                        RIO-000000
                    </span>

                </div>


            </section>


            <!-- =================================================
                 RATING SECTION
            ================================================= -->

            <section
                class="rating-box"
                aria-label="Customer Rating">


                <h2>
                    How Was Your Maggi?
                </h2>


                <div
                    class="star-rating"
                    role="radiogroup"
                    aria-label="Rate your experience"
                >


                    <i
                        class="fa-regular fa-star star"
                        data-rate="1"
                        role="radio"
                        aria-label="1 star"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="2"
                        role="radio"
                        aria-label="2 stars"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="3"
                        role="radio"
                        aria-label="3 stars"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="4"
                        role="radio"
                        aria-label="4 stars"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="5"
                        role="radio"
                        aria-label="5 stars"
                        tabindex="0"
                    ></i>


                </div>


                <p id="ratingText">
                    Tap A Star
                </p>


            </section>


            <!-- =================================================
                 PART 1 END
            ===================================================== -->
                 <!-- =====================================================
         FEEDBACK.HTML
         PART 2/3
         EMOTION + REVIEW + SUBMIT
    ====================================================== -->


    <!-- =================================================
         EMOTION SECTION
    ================================================= -->

    <section
        class="emoji-box"
        aria-label="How do you feel about your experience?"
    >

        <h2>
            How Do You Feel?
        </h2>


        <div
            class="emoji-list"
            role="group"
            aria-label="Select your feeling"
        >


            <button
                class="emoji-btn"
                type="button"
                data-emotion="😍"
                aria-label="Very happy"
            >
                😍
            </button>


            <button
                class="emoji-btn"
                type="button"
                data-emotion="😊"
                aria-label="Happy"
            >
                😊
            </button>


            <button
                class="emoji-btn"
                type="button"
                data-emotion="😋"
                aria-label="Tasty"
            >
                😋
            </button>


            <button
                class="emoji-btn"
                type="button"
                data-emotion="🤩"
                aria-label="Amazing"
            >
                🤩
            </button>


            <button
                class="emoji-btn"
                type="button"
                data-emotion="🥰"
                aria-label="Loved it"
            >
                🥰
            </button>


        </div>

    </section>



    <!-- =================================================
         REVIEW TEXT SECTION
    ================================================= -->

    <section
        class="review-box"
        aria-label="Write your review"
    >


        <h2>
            Write Your Review
        </h2>


        <textarea
            id="reviewText"
            maxlength="300"
            rows="5"
            placeholder="Tell us about your Maggi experience today..."
            aria-label="Your review"
        ></textarea>


        <!-- =============================================
             CHARACTER COUNTER
        ============================================== -->

        <div
            class="character-count"
            aria-live="polite"
        >

            <span id="charCount">
                0
            </span>

            /300

        </div>


    </section>



    <!-- =================================================
         SUBMIT FEEDBACK SECTION
    ================================================= -->

    <section
        class="submit-box"
        aria-label="Submit your feedback"
    >


        <button
            id="submitFeedback"
            class="submit-btn"
            type="button"
        >


            <i
                class="fa-solid fa-paper-plane"
                aria-hidden="true"
            ></i>


            <span class="submit-btn-text">
                Submit Feedback
            </span>


            <!-- =========================================
                 SUBMIT LOADING ICON
                 Hidden by default
            ========================================== -->

            <i
                class="fa-solid fa-spinner fa-spin submit-loading-icon"
                aria-hidden="true"
                style="display: none;"
            ></i>


        </button>


        <!-- =============================================
             ERROR MESSAGE
        ============================================== -->

        <p
            id="feedbackError"
            class="feedback-error"
            role="alert"
            aria-live="assertive"
            style="display: none;"
        ></p>


    </section>



    <!-- =================================================
         THANK YOU / SUCCESS MESSAGE
    ================================================= -->

    <section
        id="thankYouBox"
        class="thankyou-box"
        aria-live="polite"
        style="display: none;"
    >


        <div
            class="thankyou-icon"
            aria-hidden="true"
        >

            <i class="fa-solid fa-circle-check"></i>

        </div>


        <h2>
            🎉 Thank You!
        </h2>


        <p>
            Your feedback has been submitted successfully.
        </p>


        <span>
            We truly appreciate your support of Rio Maggi Point.
        </span>


    </section>



    <!-- =================================================
         NAVIGATION SAFE SPACE
         Bottom navigation will be added in Part 3.
    ================================================= -->

    <div
        class="nav-space"
        aria-hidden="true"
    ></div>



    <!-- =================================================
         PART 2 END
         NEXT: BOTTOM NAVIGATION + JAVASCRIPT
    ================================================= -->
                 <!-- =====================================================
         FEEDBACK.HTML
         PART 3/3
         BOTTOM NAVIGATION + SCRIPTS
         FINAL PART
    ====================================================== -->


    <!-- =================================================
         BOTTOM NAVIGATION
         TEMPORARY MASTER STRUCTURE
         FINAL NAVIGATION WILL BE FIXED AFTER
         ALL MAIN PAGES ARE COMPLETED
    ================================================= -->

    <nav
        class="bottom-nav"
        id="commonBottomNav"
        aria-label="Main Navigation"
    >


        <!-- =============================================
             HOME
        ============================================== -->

        <a
            href="card.html"
            class="nav-item"
            aria-label="Home"
        >

            <i
                class="fa-solid fa-house"
                aria-hidden="true"
            ></i>

            <span>
                Home
            </span>

        </a>



        <!-- =============================================
             QR
        ============================================== -->

        <a
            href="qr.html"
            class="nav-item"

<!-- =====================================================
     FEEDBACK PAGE FINALIZATION
===================================================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        () => {


            /* =========================================
               CHARACTER COUNTER FALLBACK
               Keeps counter synchronized even if
               feedback.js does not handle it.
            ========================================== */

            const reviewText =
                document.getElementById(
                    "reviewText"
                );


            const charCount =
                document.getElementById(
                    "charCount"
                );


            if (
                reviewText &&
                charCount
            ) {

                const updateCharacterCount =
                    () => {

                        charCount.textContent =
                            reviewText.value.length;

                    };


                reviewText.addEventListener(
                    "input",
                    updateCharacterCount
                );


                updateCharacterCount();

            }



            /* =========================================
               EMOTION BUTTON ACTIVE STATE
               The selected emotion is visually marked.
            ========================================== */

            const emojiButtons =
                document.querySelectorAll(
                    ".emoji-btn"
                );


            emojiButtons.forEach(
                (button) => {

                    button.addEventListener(
                        "click",
                        () => {


                            emojiButtons.forEach(
                                (item) => {

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                            button.classList.add(
                                "active"
                            );


                        }
                    );

                }
            );



            /* =========================================
               KEYBOARD ACCESS FOR STAR RATING
            ========================================== */

            const stars =
                document.querySelectorAll(
                    ".star"
                );


            stars.forEach(
                (star) => {

                    star.addEventListener(
                        "keydown",
                        (event) => {


                            if (
                                event.key === "Enter" ||
                                event.key === " "
                            ) {

                                event.preventDefault();

                                star.click();

                            }

                        }
                    );

                }
            );



            /* =========================================
               PREVENT IMAGE DRAGGING
            ========================================== */

            document
                .querySelectorAll(
                    "img"
                )
                .forEach(
                    (image) => {

                        image.addEventListener(
                            "dragstart",
                            (event) => {

                                event.preventDefault();

                            }
                        );

                    }
                );



            /* =========================================
               PAGE READY
            ========================================== */

            document.body.classList.add(
                "feedback-page-ready"
            );


        }
    );



    /* =================================================
       ACTIVE NAVIGATION
       Automatically detects current page.
       Final navigation system will be standardized
       after all pages are completed.
    ================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        () => {


            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase();


            document
                .querySelectorAll(
                    ".bottom-nav .nav-item"
                )
                .forEach(
                    (item) => {


                        const href =
                            item
                                .getAttribute(
                                    "href"
                                );


                        if (
                            !href
                        ) {

                            return;

                        }


                        const targetPage =
                            href
                                .split("/")
                                .pop()
                                .toLowerCase();


                        if (
                            targetPage === currentPage
                        ) {

                            item.classList.add(
                                "active"
                            );


                            item.setAttribute(
                                "aria-current",
                                "page"
                            );

                        }

                        else {

                            item.classList.remove(
                                "active"
                            );


                            item.removeAttribute(
                                "aria-current"
                            );

                        }


                    }
                );


        }
    );

</script>
