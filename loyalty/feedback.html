/<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Rio Maggi Point • Review
</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/feedback.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


<div class="page">


<div class="feedback-card">


<div class="card-glow"></div>

<div class="card-shine"></div>


<!-- ================= HEADER ================= -->


<div class="feedback-header">


<h1>

RIO MAGGI POINT

</h1>


<p>

Premium Customer Review

</p>


</div>



<!-- ================= CUSTOMER ================= -->


<div class="customer-section">


<div class="avatar-frame">


<img

id="feedbackPhoto"

src="assets/avatars/male.png"

alt="Customer">


</div>



<div

id="feedbackName"

class="customer-name">

Loading...

</div>



<div class="customer-id">

ID :

<span id="feedbackMember">

RIO-000000

</span>


</div>



</div>



<!-- ================= RATING ================= -->


<div class="rating-box">


<h2>

How Was Your Maggi?

</h2>


<div class="star-rating">


<i class="fa-regular fa-star star" data-rate="1"></i>

<i class="fa-regular fa-star star" data-rate="2"></i>

<i class="fa-regular fa-star star" data-rate="3"></i>

<i class="fa-regular fa-star star" data-rate="4"></i>

<i class="fa-regular fa-star star" data-rate="5"></i>


</div>


<p id="ratingText">

Tap A Star

</p>


</div>

<!-- ================= EMOJI FEELING ================= -->


<div class="emoji-box">


<h2>

How Do You Feel?

</h2>


<div class="emoji-list">


<button class="emoji-btn">

😍

</button>


<button class="emoji-btn">

😊

</button>


<button class="emoji-btn">

😋

</button>


<button class="emoji-btn">

🤩

</button>


<button class="emoji-btn">

🥰

</button>


</div>


</div>



<!-- ================= REVIEW BOX ================= -->


<div class="review-box">


<h2>

Write Your Review

</h2>


<textarea

id="reviewText"

maxlength="300"

placeholder="Tell us about your Maggi experience today...">

</textarea>



<div class="character-count">


<span id="charCount">

0

</span>

/300


</div>


</div>



<!-- ================= SUBMIT ================= -->


<div class="submit-box">


<button

id="submitFeedback"

class="submit-btn">


<i class="fa-solid fa-paper-plane"></i>


Submit Feedback


</button>


</div>



<!-- ================= THANK YOU ================= -->


<div

id="thankYouBox"

class="thankyou-box"

style="display:none;">


<h2>

🎉 Thank You!

</h2>


<p>

Your feedback has been submitted successfully.

</p>


</div>

<!-- ================= BOTTOM NAVIGATION ================= -->


<nav class="bottom-nav">


<a href="card.html">


<i class="fa-solid fa-house"></i>


<span>

Home

</span>


</a>



<a href="qr.html">


<i class="fa-solid fa-qrcode"></i>


<span>

QR

</span>


</a>



<a href="history.html">


<i class="fa-solid fa-clock-rotate-left"></i>


<span>

History

</span>


</a>



<a

href="feedback.html"

class="active">


<i class="fa-solid fa-heart"></i>


<span>

Review

</span>


</a>



<a href="profile.html">


<i class="fa-solid fa-user"></i>


<span>

Profile

</span>


</a>



</nav>



</div>

</div>



<!-- ================= FEEDBACK JS ================= -->


<script

type="module"

src="js/feedback.js">

</script>



<script>


if("serviceWorker" in navigator){


window.addEventListener("load",()=>{


navigator.serviceWorker.register("./service-worker.js");


});


}


</script>



</body>

</html>
