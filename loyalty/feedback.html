<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         RIO MAGGI POINT
         PREMIUM CUSTOMER REVIEW PAGE
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        Rio Maggi Point • Review
    </title>


    <!-- =========================================
         SEO / PWA
    ========================================== -->

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="Rio Maggi Point Premium Customer Review"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        href="favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >


    <!-- =========================================
         GOOGLE FONT
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         FONT AWESOME
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =========================================
         COMMON CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/common.css"
    >


    <!-- =========================================
         FEEDBACK PAGE CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/feedback.css"
    >


    <!-- =========================================
         FEEDBACK PAGE BASE STYLE
         Kept here from your existing design
    ========================================== -->

    <style>

        /* =========================================
           GLOBAL RESET
        ========================================== */

        *,
        *::before,
        *::after {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        /* =========================================
           ROOT VARIABLES
        ========================================== */

        :root {

            --black: #111111;

            --black-soft: #1a1a1a;

            --black-card: #202020;

            --red: #c62828;

            --red-dark: #8f1515;

            --red-light: #e53935;

            --gold: #ffd54f;

            --gold-dark: #d19b4a;

            --cream: #fff8e7;

            --cream-soft: #fffdf5;

            --text-dark: #241c1c;

            --text-muted: #75645c;

            --white: #ffffff;

            --border-light:
                rgba(209, 155, 74, .45);

        }


        /* =========================================
           HTML
        ========================================== */

        html {

            width: 100%;

            min-height: 100%;

            scroll-behavior: smooth;

            -webkit-text-size-adjust: 100%;

        }


        /* =========================================
           BODY
        ========================================== */

        body {

            width: 100%;

            min-height: 100vh;

            margin: 0;

            padding: 0;

            font-family:
                'Poppins',
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #2a0f0f 0%,
                    #111111 38%,
                    #080808 100%
                );

            color:
                var(--text-dark);

            overflow-x: hidden;

        }


        /* =========================================
           MAIN PAGE
        ========================================== */

        .page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            padding:
                24px
                20px
                120px;

            display: flex;

            justify-content: center;

            align-items: flex-start;

        }


        /* =========================================
           BACKGROUND PREMIUM GLOW
        ========================================== */

        .page::before {

            content: "";

            position: fixed;

            top: -180px;

            left: 50%;

            width: 560px;

            height: 560px;

            transform:
                translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(
                        198,
                        40,
                        40,
                        .20
                    ) 0%,
                    rgba(
                        198,
                        40,
                        40,
                        .06
                    ) 42%,
                    transparent 72%
                );

            pointer-events: none;

            z-index: 0;

        }


        /* =========================================
           FEEDBACK CARD
        ========================================== */

        .feedback-card {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            overflow: hidden;

            border:
                1px solid
                var(--border-light);

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    #fff8e7,
                    #f8e8c4
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    .40
                );

            animation:
                feedbackCardEnter
                .7s
                ease
                both;

        }


        /* =========================================
           CARD ENTRY ANIMATION
        ========================================== */

        @keyframes feedbackCardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(28px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           CARD GLOW
        ========================================== */

        .card-glow {

            position: absolute;

            top: -120px;

            right: -120px;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        198,
                        40,
                        40,
                        .22
                    ),
                    transparent 70%
                );

            pointer-events: none;

            z-index: 0;

        }


        /* =========================================
           CARD SHINE
        ========================================== */

        .card-shine {

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(
                        255,
                        255,
                        255,
                        .18
                    ),
                    transparent
                );

            transform:
                skewX(-18deg);

            pointer-events: none;

            z-index: 4;

            animation:
                cardShineMove
                6s
                ease-in-out
                infinite;

        }


        @keyframes cardShineMove {

            0% {

                left: -120%;

            }

            35% {

                left: 130%;

            }

            100% {

                left: 130%;

            }

        }


        /* =========================================
           FEEDBACK HEADER
        ========================================== */

        .feedback-header {

            position: relative;

            z-index: 2;

            padding:
                30px
                24px
                26px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #151515,
                    #241010
                );

            border-bottom:
                1px solid
                rgba(
                    198,
                    40,
                    40,
                    .45
                );

        }


        .feedback-header h1 {

            font-size:
                clamp(
                    22px,
                    5vw,
                    32px
                );

            line-height: 1.2;

            font-weight: 800;

            letter-spacing: 1.5px;

            color:
                var(--white);

        }


        .feedback-header p {

            margin-top: 8px;

            font-size:
                clamp(
                    12px,
                    2.5vw,
                    15px
                );

            line-height: 1.5;

            font-weight: 400;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .70
                );

        }


        /* =========================================
           CUSTOMER SECTION
        ========================================== */

        .customer-section {

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding:
                28px
                20px
                24px;

            text-align: center;

        }


        /* =========================================
           AVATAR
        ========================================== */

        .avatar-frame {

            position: relative;

            width: 96px;

            height: 96px;

            padding: 4px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    var(--red),
                    var(--gold)
                );

            box-shadow:
                0 12px 30px
                rgba(
                    198,
                    40,
                    40,
                    .28
                );

            animation:
                avatarFloat
                3s
                ease-in-out
                infinite;

        }


        @keyframes avatarFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-5px);

            }

        }


        .avatar-frame img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            background:
                var(--cream);

            border:
                3px solid
                var(--cream);

        }


        /* =========================================
           CUSTOMER NAME
        ========================================== */

        .customer-name {

            margin-top: 14px;

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            line-height: 1.3;

            font-weight: 800;

            color:
                var(--black);

        }


        /* =========================================
           CUSTOMER ID
        ========================================== */

        .customer-id {

            margin-top: 5px;

            font-size: 11px;

            line-height: 1.5;

            font-weight: 600;

            letter-spacing: .6px;

            color:
                var(--text-muted);

        }


        .customer-id span {

            color:
                var(--red);

        }


        /* =========================================
           RATING BOX
        ========================================== */

        .rating-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

            padding:
                24px
                18px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .62
                );

            border:
                2px solid
                var(--border-light);

            border-radius: 20px;

            box-shadow:
                0 10px 25px
                rgba(
                    0,
                    0,
                    0,
                    .08
                );

        }


        .rating-box h2 {

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            line-height: 1.3;

            font-weight: 800;

            color:
                var(--black);

        }


        /* =========================================
           STAR RATING
        ========================================== */

        .star-rating {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 17px;

        }


        .star {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            font-size: 27px;

            color:
                var(--gold-dark);

            cursor: pointer;

            transition:
                transform .25s ease,
                color .25s ease,
                background .25s ease;

        }


        .star:hover {

            transform:
                translateY(-4px)
                scale(1.08);

            color:
                var(--red);

            background:
                rgba(
                    198,
                    40,
                    40,
                    .08
                );

        }


        .star.active {

            color:
                var(--red);

            transform:
                scale(1.08);

        }


        #ratingText {

            min-height: 22px;

            margin-top: 10px;

            font-size: 12px;

            line-height: 1.5;

            font-weight: 600;

            color:
                var(--text-muted);

        }


        /* =========================================
           EMOJI BOX
        ========================================== */

        .emoji-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

            padding:
                24px
                18px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .62
                );

            border:
                2px solid
                var(--border-light);

            border-radius: 20px;

        }


        .emoji-box h2 {

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            font-weight: 800;

            color:
                var(--black);

        }


        .emoji-list {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 18px;

        }


        .emoji-btn {

            width: 52px;

            height: 52px;

            border: 1px solid
                rgba(
                    209,
                    155,
                    74,
                    .35
                );

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .65
                );

            font-size: 27px;

            cursor: pointer;

            transition:
                transform .25s ease,
                background .25s ease,
                box-shadow .25s ease;

        }


        .emoji-btn:hover {

            transform:
                translateY(-4px)
                scale(1.05);

        }


        .emoji-btn.active {

            transform:
                translateY(-4px)
                scale(1.08);

            background:
                rgba(
                    198,
                    40,
                    40,
                    .12
                );

            box-shadow:
                0 8px 20px
                rgba(
                    198,
                    40,
                    40,
                    .20
                );

        }


        /* =========================================
           REVIEW BOX
        ========================================== */

        .review-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

            padding:
                24px
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .62
                );

            border:
                2px solid
                var(--border-light);

            border-radius: 20px;

        }


        .review-box h2 {

            font-size:
                clamp(
                    18px,
                    4vw,
                    23px
                );

            font-weight: 800;

            text-align: center;

            color:
                var(--black);

        }


        #reviewText {

            width: 100%;

            min-height: 130px;

            margin-top: 18px;

            padding: 15px;

            resize: vertical;

            font-family:
                'Poppins',
                sans-serif;

            font-size: 14px;

            line-height: 1.6;

            color:
                var(--text-dark);

            background:
                rgba(
                    255,
                    255,
                    255,
                    .80
                );

            border:
                1px solid
                var(--border-light);

            border-radius: 14px;

            outline: none;

            transition:
                border-color .25s ease,
                box-shadow .25s ease;

        }


        #reviewText:focus {

            border-color:
                var(--red);

            box-shadow:
                0 0 0 3px
                rgba(
                    198,
                    40,
                    40,
                    .10
                );

        }


        .character-count {

            margin-top: 7px;

            text-align: right;

            font-size: 11px;

            font-weight: 600;

            color:
                var(--text-muted);

        }


        /* =========================================
           SUBMIT BOX
        ========================================== */

        .submit-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

        }


        .submit-btn {

            width: 100%;

            min-height: 54px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    var(--red),
                    var(--red-dark)
                );

            color:
                var(--white);

            font-family:
                'Poppins',
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(
                    198,
                    40,
                    40,
                    .25
                );

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                opacity .25s ease;

        }


        .submit-btn:hover:not(:disabled) {

            transform:
                translateY(-3px);

            box-shadow:
                0 14px 30px
                rgba(
                    198,
                    40,
                    40,
                    .32
                );

        }


        .submit-btn:disabled {

            opacity: .65;

            cursor:
                not-allowed;

        }


        .submit-loading-icon {

            display: none;

        }


        .feedback-error {

            display: none;

            margin-top: 12px;

            padding: 11px 14px;

            text-align: center;

            font-size: 12px;

            font-weight: 600;

            color:
                #8f1515;

            background:
                rgba(
                    198,
                    40,
                    40,
                    .10
                );

            border:
                1px solid
                rgba(
                    198,
                    40,
                    40,
                    .30
                );

            border-radius: 10px;

        }


        /* =========================================
           THANK YOU BOX
        ========================================== */

        .thankyou-box {

            position: relative;

            z-index: 2;

            margin:
                0
                20px
                20px;

            padding:
                24px
                18px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .72
                );

            border:
                2px solid
                rgba(
                    76,
                    175,
                    80,
                    .35
                );

            border-radius: 20px;

            animation:
                feedbackCardEnter
                .4s
                ease
                both;

        }


        .thankyou-icon {

            font-size: 48px;

            color:
                #2e7d32;

        }


        .thankyou-box h2 {

            margin-top: 10px;

            font-size: 22px;

            font-weight: 800;

            color:
                var(--black);

        }


        .thankyou-box p {

            margin-top: 8px;

            font-size: 13px;

            font-weight: 600;

            color:
                var(--text-dark);

        }


        .thankyou-box span {

            display: block;

            margin-top: 6px;

            font-size: 11px;

            color:
                var(--text-muted);

        }


        /* =========================================
           NAVIGATION SPACE
        ========================================== */

        .nav-space {

            height: 90px;

        }


        /* =========================================
           BOTTOM NAVIGATION
        ========================================== */

        .bottom-nav {

            position: fixed;

            left: 50%;

            bottom: 14px;

            transform:
                translateX(-50%);

            z-index: 1000;

            width:
                calc(
                    100% - 24px
                );

            max-width: 760px;

            display: grid;

            grid-template-columns:
                repeat(
                    6,
                    1fr
                );

            gap: 4px;

            padding: 8px;

            background:
                rgba(
                    17,
                    17,
                    17,
                    .96
                );

            border:
                1px solid
                rgba(
                    209,
                    155,
                    74,
                    .35
                );

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

        }


        .nav-item {

            min-width: 0;

            padding:
                8px
                4px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            text-decoration: none;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .60
                );

            border-radius: 13px;

            transition:
                color .25s ease,
                background .25s ease,
                transform .25s ease;

        }


        .nav-item i {

            font-size: 16px;

        }


        .nav-item span {

            font-size: 9px;

            font-weight: 600;

            white-space: nowrap;

        }


        .nav-item:hover {

            color:
                var(--white);

            background:
                rgba(
                    198,
                    40,
                    40,
                    .16
                );

        }


        .nav-item.active {

            color:
                var(--gold);

            background:
                rgba(
                    198,
                    40,
                    40,
                    .20
                );

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (
            max-width: 480px
        ) {

            .page {

                padding:
                    12px
                    10px
                    110px;

            }


            .feedback-card {

                border-radius: 20px;

            }


            .feedback-header {

                padding:
                    22px
                    16px
                    20px;

            }


            .feedback-header h1 {

                font-size: 21px;

                letter-spacing: 1px;

            }


            .feedback-header p {

                font-size: 11px;

            }


            .customer-section {

                padding:
                    24px
                    16px
                    20px;

            }


            .avatar-frame {

                width: 82px;

                height: 82px;

            }


            .rating-box,
            .emoji-box,
            .review-box {

                margin-left: 12px;

                margin-right: 12px;

                padding:
                    20px
                    12px;

                border-radius: 17px;

            }


            .rating-box h2,
            .emoji-box h2,
            .review-box h2 {

                font-size: 17px;

            }


            .star-rating {

                gap: 4px;

            }


            .star {

                width: 39px;

                height: 39px;

                font-size: 24px;

            }


            .emoji-btn {

                width: 45px;

                height: 45px;

                font-size: 23px;

            }


            .submit-box,
            .thankyou-box {

                margin-left: 12px;

                margin-right: 12px;

            }


            .bottom-nav {

                width:
                    calc(
                        100% - 14px
                    );

                bottom: 7px;

                border-radius: 16px;

            }


            .nav-item {

                padding:
                    7px
                    2px;

            }


            .nav-item i {

                font-size: 14px;

            }


            .nav-item span {

                font-size: 8px;

            }

        }


        /* =========================================
           VERY SMALL MOBILE
        ========================================== */

        @media (
            max-width: 360px
        ) {

            .page {

                padding-left: 7px;

                padding-right: 7px;

            }


            .feedback-header {

                padding:
                    19px
                    12px;

            }


            .feedback-header h1 {

                font-size: 19px;

            }


            .avatar-frame {

                width: 76px;

                height: 76px;

            }


            .star-rating {

                gap: 2px;

            }


            .star {

                width: 36px;

                height: 36px;

                font-size: 22px;

            }


            .bottom-nav {

                gap: 1px;

                padding: 6px;

            }


            .nav-item span {

                font-size: 7px;

            }

        }


        /* =========================================
           TABLET
        ========================================== */

        @media (
            min-width: 481px
        )
        and (
            max-width: 1024px
        ) {

            .page {

                padding:
                    30px
                    24px
                    125px;

            }


            .feedback-card {

                max-width: 720px;

            }


            .feedback-header {

                padding: 30px;

            }


            .customer-section {

                padding:
                    32px
                    24px
                    28px;

            }


            .rating-box,
            .emoji-box,
            .review-box {

                margin:
                    0
                    24px
                    24px;

            }

        }


        /* =========================================
           LAPTOP
        ========================================== */

        @media (
            min-width: 1025px
        )
        and (
            max-width: 1440px
        ) {

            .page {

                padding:
                    38px
                    30px
                    135px;

            }


            .feedback-card {

                max-width: 780px;

            }

        }


        /* =========================================
           LARGE DESKTOP
        ========================================== */

        @media (
            min-width: 1441px
        ) {

            .page {

                padding:
                    45px
                    30px
                    145px;

            }


            .feedback-card {

                max-width: 820px;

            }

        }


        /* =========================================
           REDUCED MOTION
        ========================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;

                transition-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         MAIN FEEDBACK PAGE
    ========================================== -->

    <main class="page">


        <!-- =========================================
             PREMIUM FEEDBACK CARD
        ========================================== -->

        <div class="feedback-card app-card">


            <!-- =====================================
                 DECORATIVE EFFECTS
            ====================================== -->

            <div
                class="card-glow"
                aria-hidden="true"
            ></div>


            <div
                class="card-shine"
                aria-hidden="true"
            ></div>


            <!-- =====================================
                 HEADER
            ====================================== -->

            <header class="feedback-header">

                <h1>
                    RIO MAGGI POINT
                </h1>

                <p>
                    Premium Customer Review
                </p>

            </header>


            <!-- =====================================
                 CUSTOMER SECTION
            ====================================== -->

            <section
                class="customer-section"
                aria-label="Customer Information"
            >

                <div class="avatar-frame">

                    <img
                        id="feedbackPhoto"
                        src="assets/avatars/male.png"
                        alt="Customer Profile Photo"
                    >

                </div>


                <div
                    id="feedbackName"
                    class="customer-name"
                >
                    Loading...
                </div>


                <div class="customer-id">

                    ID :

                    <span id="feedbackMember">
                        RIO-000000
                    </span>

                </div>

            </section>


            <!-- =====================================
                 RATING SECTION
            ====================================== -->

            <section
                class="rating-box"
                aria-label="Customer Rating"
            >

                <h2>
                    How Was Your Maggi?
                </h2>


                <div
                    class="star-rating"
                    role="radiogroup"
                    aria-label="Rate your experience"
                >

                    <i
                        class="fa-regular fa-star star"
                        data-rate="1"
                        role="radio"
                        aria-label="1 star"
                        aria-checked="false"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="2"
                        role="radio"
                        aria-label="2 stars"
                        aria-checked="false"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="3"
                        role="radio"
                        aria-label="3 stars"
                        aria-checked="false"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="4"
                        role="radio"
                        aria-label="4 stars"
                        aria-checked="false"
                        tabindex="0"
                    ></i>


                    <i
                        class="fa-regular fa-star star"
                        data-rate="5"
                        role="radio"
                        aria-label="5 stars"
                        aria-checked="false"
                        tabindex="0"
                    ></i>

                </div>


                <p id="ratingText">
                    Tap A Star
                </p>

            </section>


            <!-- =====================================
                 EMOTION SECTION
            ====================================== -->

            <section
                class="emoji-box"
                aria-label="How do you feel about your experience?"
            >

                <h2>
                    How Do You Feel?
                </h2>


                <div
                    class="emoji-list"
                    role="group"
                    aria-label="Select your feeling"
                >

                    <button
                        class="emoji-btn"
                        type="button"
                        data-emotion="😍"
                        aria-label="Very happy"
                        aria-pressed="false"
                    >
                        😍
                    </button>


                    <button
                        class="emoji-btn"
                        type="button"
                        data-emotion="😊"
                        aria-label="Happy"
                        aria-pressed="false"
                    >
                        😊
                    </button>


                    <button
                        class="emoji-btn"
                        type="button"
                        data-emotion="😋"
                        aria-label="Tasty"
                        aria-pressed="false"
                    >
                        😋
                    </button>


                    <button
                        class="emoji-btn"
                        type="button"
                        data-emotion="🤩"
                        aria-label="Amazing"
                        aria-pressed="false"
                    >
                        🤩
                    </button>


                    <button
                        class="emoji-btn"
                        type="button"
                        data-emotion="🥰"
                        aria-label="Loved it"
                        aria-pressed="false"
                    >
                        🥰
                    </button>

                </div>

            </section>


            <!-- =====================================
                 REVIEW TEXT
            ====================================== -->

            <section
                class="review-box"
                aria-label="Write your review"
            >

                <h2>
                    Write Your Review
                </h2>


                <textarea
                    id="reviewText"
                    maxlength="300"
                    rows="5"
                    placeholder="Tell us about your Maggi experience today..."
                    aria-label="Your review"
                ></textarea>


                <div
                    class="character-count"
                    aria-live="polite"
                >

                    <span id="charCount">
                        0
                    </span>

                    /300

                </div>

            </section>


            <!-- =====================================
                 SUBMIT SECTION
            ====================================== -->

            <section
                class="submit-box"
                aria-label="Submit your feedback"
            >

                <button
                    id="submitFeedback"
                    class="submit-btn"
                    type="button"
                >

                    <i
                        class="fa-solid fa-paper-plane"
                        aria-hidden="true"
                    ></i>


                    <span class="submit-btn-text">
                        Submit Feedback
                    </span>


                    <i
                        class="fa-solid fa-spinner fa-spin submit-loading-icon"
                        aria-hidden="true"
                        style="display: none;"
                    ></i>

                </button>


                <p
                    id="feedbackError"
                    class="feedback-error"
                    role="alert"
                    aria-live="assertive"
                    style="display: none;"
                ></p>

            </section>


            <!-- =====================================
                 THANK YOU MESSAGE
            ====================================== -->

            <section
                id="thankYouBox"
                class="thankyou-box"
                aria-live="polite"
                style="display: none;"
            >

                <div
                    class="thankyou-icon"
                    aria-hidden="true"
                >

                    <i class="fa-solid fa-circle-check"></i>

                </div>


                <h2>
                    🎉 Thank You!
                </h2>


                <p>
                    Your feedback has been submitted successfully.
                </p>


                <span>
                    We truly appreciate your support of Rio Maggi Point.
                </span>

            </section>


            <!-- =====================================
                 NAVIGATION SPACE
            ====================================== -->

            <div
                class="nav-space"
                aria-hidden="true"
            ></div>


        </div>

    </main>


    <!-- =========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav
        class="bottom-nav"
        id="commonBottomNav"
        aria-label="Main Navigation"
    >

        <!-- HOME -->

        <a
            href="card.html"
            class="nav-item"
            aria-label="Home"
        >

            <i
                class="fa-solid fa-house"
                aria-hidden="true"
            ></i>

            <span>
                Home
            </span>

        </a>


        <!-- QR -->

        <a
            href="qr.html"
            class="nav-item"
            aria-label="QR Code"
        >

            <i
                class="fa-solid fa-qrcode"
                aria-hidden="true"
            ></i>

            <span>
                QR
            </span>

        </a>


        <!-- HISTORY -->

        <a

            class="nav-item"
            aria-label="Loyalty History"
        >

            <i

                aria-hidden="true"
            ></i>

            <span>
                History
            </span>

        </a>


        <!-- MENU -->

        <a
            href="menu.html"
            class="nav-item"
            aria-label="Menu"
        >

            <i
                class="fa-solid fa-utensils"
                aria-hidden="true"
            ></i>

            <span>
                Menu
            </span>

        </a>


        <!-- REVIEW -->

        <a
            href="feedback.html"
            class="nav-item active"
            aria-current="page"
            aria-label="Review"
        >

            <i
                class="fa-solid fa-heart"
                aria-hidden="true"
            ></i>

            <span>
                Review
            </span>

        </a>


        <!-- PROFILE -->

        <a
            href="profile.html"
            class="nav-item"
            aria-label="Profile"
        >

            <i
                class="fa-solid fa-user"
                aria-hidden="true"
            ></i>

            <span>
                Profile
            </span>

        </a>

    </nav>


    <!-- =========================================
         FEEDBACK JAVASCRIPT
         ONLY ONE JS FILE
    ========================================== -->

    <script
        type="module"
        src="js/feedback.js"
    ></script>


    <!-- =========================================
         SERVICE WORKER
         REGISTER ONCE
    ========================================== -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(
                            () => {

                                console.log(
                                    "Rio Maggi Point Service Worker Registered"
                                );

                            }
                        )
                        .catch(
                            (error) => {

                                console.error(
                                    "Service Worker Registration Failed:",
                                    error
                                );

                            }
                        );

                },
                {
                    once: true
                }
            );

        }

    </script>


    <!-- =========================================
         ACTIVE NAVIGATION
         NO DUPLICATE FEEDBACK LOGIC
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const currentPage =
                    window.location.pathname
                        .split("/")
                        .pop()
                        .toLowerCase();


                document
                    .querySelectorAll(
                        ".bottom-nav .nav-item"
                    )
                    .forEach(
                        (item) => {

                            const href =
                                item.getAttribute(
                                    "href"
                                );


                            if (!href) {

                                return;

                            }


                            const targetPage =
                                href
                                    .split("/")
                                    .pop()
                                    .toLowerCase();


                            if (
                                targetPage ===
                                currentPage
                            ) {

                                item.classList.add(
                                    "active"
                                );

                                item.setAttribute(
                                    "aria-current",
                                    "page"
                                );

                            }

                            else {

                                item.classList.remove(
                                    "active"
                                );

                                item.removeAttribute(
                                    "aria-current"
                                );

                            }

                        }
                    );

            }
        );

    </script>


</body>

</html>
