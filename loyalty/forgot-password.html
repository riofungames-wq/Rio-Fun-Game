<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Forgot Password

</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/forgot-password.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<header class="forgot-header">

<h1>

🔐 Forgot Password

</h1>

<p>

Reset Your Rio Maggi Point Password

</p>

</header>

<section class="forgot-card">

<form id="forgotForm">

<div class="form-group">

<label>

Registered Email

</label>

<input

type="email"

id="resetEmail"

placeholder="Enter your registered email"

required>

</div>

<button

type="submit"

id="resetBtn"

class="primary-btn">

Send Reset Link

</button>

</form>

</section>

<section
id="successBox"
style="display:none;">

<h2>

✅ Email Sent

</h2>

<p>

Please check your inbox and follow the password reset link.

</p>

</section>
  <!-- ================================= -->
<!-- ACTIONS -->
<!-- ================================= -->

<section class="action-section">

<button
id="backLoginBtn"
class="secondary-btn">

<i class="fa-solid fa-arrow-left"></i>

Back To Login

</button>

</section>

</div>

<!-- ================================= -->
<!-- FORGOT PASSWORD JS -->
<!-- ================================= -->

<script
type="module"
src="js/forgot-password.js"></script>

</body>
</html>
