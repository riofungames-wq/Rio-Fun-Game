<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rio Maggi Point | Forgot Password</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="icon"
href="assets/logo/logo.png">

<link
rel="stylesheet"
href="css/forgot-password.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="page">


<header class="forgot-header">

<div class="header-icon">

<i class="fa-solid fa-lock"></i>

</div>

<h1>
Forgot Password
</h1>

<p>
Reset Your Rio Maggi Point Password
</p>

</header>


<section class="forgot-card">


<form id="forgotForm">


<div class="form-group">


<label for="resetEmail">
Registered Email
</label>


<div class="input-wrapper">

<i class="fa-solid fa-envelope"></i>


<input

type="email"

id="resetEmail"

name="resetEmail"

placeholder="Enter your registered email"

autocomplete="email"

required>

</div>


</div>


<button

type="submit"

id="resetBtn"

class="primary-btn">

<i class="fa-solid fa-paper-plane"></i>

&nbsp;

Send Reset Link

</button>


</form>


</section>


<section
id="successBox"
class="success-box"
style="display:none;">

<div class="success-icon">

<i class="fa-solid fa-circle-check"></i>

</div>


<h2>
Email Sent
</h2>


<p>
Please check your inbox and follow the password reset link.
</p>


</section>


<section class="action-section">


<button

type="button"

id="backLoginBtn"

class="secondary-btn">

<i class="fa-solid fa-arrow-left"></i>

&nbsp;

Back To Login

</button>


</section>


</div>


<script
type="module"
src="js/forgot-password.js">
</script>


</body>

</html>
