<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Rio Maggi Point • History
</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/common.css">

<link
rel="stylesheet"
href="css/history.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<div class="history-card app-card">

<div class="card-glow"></div>

<div class="card-shine"></div>

<!-- ================= HEADER ================= -->

<header class="history-header">

<h1>

RIO MAGGI POINT

</h1>

<p>

Premium Loyalty History

</p>

</header>

<!-- ================= CUSTOMER ================= -->

<section class="customer-section">

<div class="avatar-frame">

<img
id="historyPhoto"
src="assets/avatars/default.png"
alt="Customer">

</div>

<div
class="customer-name"
id="historyName">

Loading...

</div>

<div
class="customer-id">

ID :

<span id="historyMember">

RIO-000000

</span>

</div>

</section>

<!-- ================= CURRENT STATUS ================= -->

<section class="status-box">

<div class="status-title">

CURRENT STAMPS

</div>

<div
class="status-value"
id="historyStampCount">

0 / 6

</div>

</section>

<!-- ================= TIMELINE ================= -->

<section>

<div class="section-title">

STAMP TIMELINE

</div>

<div
id="historyTimeline"
class="timeline-list">
  
<!-- Firebase History Will Load Here -->

</div>

</section>


<!-- ================= REWARD ================= -->

<section>

<div class="section-title">

REWARD STATUS

</div>

<div class="reward-box">

<div class="reward-icon">

🍜

</div>

<div class="reward-details">

<h3 id="rewardTitle">

FREE VEG MAGGI

</h3>

<p id="rewardStatus">

Locked

</p>

</div>

</div>

</section>


<!-- ================= STATISTICS ================= -->

<section>

<div class="section-title">

YOUR STATISTICS

</div>

<div class="stats-grid">

<div class="stat-card">

<div class="stat-label">

Total Visits

</div>

<div
class="stat-value"
id="totalVisits">

0

</div>

</div>


<div class="stat-card">

<div class="stat-label">

Rewards

</div>

<div
class="stat-value"
id="totalRewardCount">

0

</div>

</div>


<div class="stat-card">

<div class="stat-label">

Member Since

</div>

<div
class="stat-value"
id="memberSince">

--

</div>

</div>

</div>

</section>


<!-- Fixed Navigation के लिए Space -->

<div class="nav-space"></div>


<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

<a href="card.html">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<a href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>

QR

</span>

</a>

<a
href="history.html"
class="active">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>

History

</span>

</a>

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>

Review

</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

</div>

</div>

<!-- ================= HISTORY JS ================= -->

<script
type="module"
src="js/history.js">
</script>

<!-- ================= SERVICE WORKER ================= -->

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>

</body>

</html>
