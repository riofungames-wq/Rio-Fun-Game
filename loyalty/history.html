<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Stamp History

</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="css/history.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="page">

<!-- ================================= -->
<!-- HEADER -->
<!-- ================================= -->

<header class="history-header">

<h1>

<i class="fa-solid fa-clock-rotate-left"></i>

Stamp History

</h1>

<p>

Your Loyalty Journey

</p>

</header>

<!-- ================================= -->
<!-- CUSTOMER CARD -->
<!-- ================================= -->

<section class="customer-card">

<div class="customer-left">

<img

id="historyPhoto"

src="assets/avatars/default.png"

alt="Customer">

</div>

<div class="customer-right">

<h2 id="historyName">

Loading...

</h2>

<p id="historyMember">

RIO-000000000

</p>

<div class="history-progress">

<span>

Current Stamps

</span>

<strong id="historyStampCount">

0 / 6

</strong>

</div>

</div>

</section>

<!-- ================================= -->
<!-- TIMELINE -->
<!-- ================================= -->

<section class="timeline-section">

<h2>

Stamp Timeline

</h2>

<div
id="historyTimeline"
class="timeline">

<!-- Firebase History -->

</div>

</section>
<!-- ================================= -->
<!-- REWARD HISTORY -->
<!-- ================================= -->

<section class="reward-section">

<h2>

Reward Status

</h2>

<div class="reward-card">

<div class="reward-icon">

🍜

</div>

<div class="reward-info">

<h3 id="rewardTitle">

Free Veg Maggi

</h3>

<p id="rewardStatus">

Locked

</p>

</div>

</div>

</section>

<!-- ================================= -->
<!-- STATISTICS -->
<!-- ================================= -->

<section class="history-stats">

<div class="stat-box">

<h3>Total Visits</h3>

<strong id="totalVisits">

0

</strong>

</div>

<div class="stat-box">

<h3>Total Rewards</h3>

<strong id="totalRewardCount">

0

</strong>

</div>

<div class="stat-box">

<h3>Member Since</h3>

<strong id="memberSince">

--

</strong>

</div>

</section>

<!-- ================================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ================================= -->

<nav class="bottom-nav">

<a href="card.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="qr.html">

<i class="fa-solid fa-qrcode"></i>

<span>QR</span>

</a>

<a
href="history.html"
class="active">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>History</span>

</a>

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>Review</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>

</div>

<!-- ================================= -->
<!-- HISTORY JS -->
<!-- ================================= -->

<script
type="module"
src="js/history.js">

</script>

</body>
</html>
