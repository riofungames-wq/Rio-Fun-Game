<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Rio Maggi Point • History
</title>

<body>


<div class="page">


<div class="history-card">


<div class="card-glow"></div>


<div class="card-shine"></div>



<!-- HEADER -->


<div class="history-header">


<h1>

RIO MAGGI POINT

</h1>


<p>

Premium Loyalty History

</p>


</div>





<!-- CUSTOMER PROFILE -->


<section class="customer-section">


<div class="avatar-frame">


<img

id="historyPhoto"

src="assets/avatars/male.png"

alt="Customer">


</div>



<h2

class="customer-name"

id="historyName">

Loading...

</h2>



<p class="customer-id">

ID :

<span id="historyMember">

RIO-000000

</span>

</p>



</section>





<!-- CURRENT STAMP STATUS -->


<section class="status-box">


<div class="status-title">

CURRENT STAMPS

</div>



<div

class="status-value"

id="historyStampCount">

0 / 6

</div>



</section>





<!-- TIMELINE -->


<section>


<div class="section-title">

STAMP TIMELINE

</div>



<div

id="historyTimeline"

class="timeline-list">


</div>


</section>

<!-- ================= REWARD STATUS ================= -->


<section>


<div class="section-title">

REWARD STATUS

</div>



<div

class="reward-box"

id="rewardBox">



<div class="reward-icon">

🍜

</div>



<div class="reward-details">


<h3 id="rewardTitle">

FREE VEG MAGGI

</h3>


<p id="rewardStatus">

🔒 Locked

</p>


</div>



</div>


</section>





<!-- ================= STATISTICS ================= -->


<section>


<div class="section-title">

YOUR STATISTICS

</div>



<div class="stats-grid">



<div class="stat-card">


<div class="stat-label">

Total Visits

</div>


<div

class="stat-value"

id="totalVisits">

0

</div>


</div>




<div class="stat-card">


<div class="stat-label">

Rewards Earned

</div>


<div

class="stat-value"

id="totalRewardCount">

0

</div>


</div>




<div class="stat-card">


<div class="stat-label">

Member Since

</div>


<div

class="stat-value"

id="memberSince">

--

</div>


</div>



</div>


</section>






<!-- ================= BOTTOM NAVIGATION ================= -->


<nav class="bottom-nav">

<span>

<i class="fa-solid fa-star"></i>

<i class="fa-solid fa-user"></i>


<span>

</a>

type="module"

src="js/history.js">

window.addEventListener(

()=>{

"./service-worker.js"

);


}
