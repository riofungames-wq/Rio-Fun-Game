<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty History - Rio Maggi Point</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/history.css">
</head>
<body>

    <main class="history-page">
        <!-- HEADER SECTION -->
        <header class="history-header">
            <div class="header-content">
                <a href="index.html" class="back-btn" aria-label="Go Back">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1>Loyalty History</h1>
            </div>
        </header>

        <!-- LOYALTY SUMMARY CARDS -->
        <section class="loyalty-summary" aria-label="Loyalty Summary">
            <div class="summary-item">
                <div class="summary-icon">
                    <i class="fa-solid fa-stamp"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Total Stamps</span>
                    <h2 id="totalStamps">0</h2>
                </div>
            </div>

            <div class="summary-item">
                <div class="summary-icon">
                    <i class="fa-solid fa-award"></i>
                </div>
                <div class="summary-info">
                    <span class="summary-label">Rewards Earned</span>
                    <h2 id="totalRewards">0</h2>
                </div>
            </div>
        </section>

        <!-- DAILY RULE / INFO BANNER -->
        <div class="daily-rule-banner">
            <div class="rule-icon">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <div class="rule-text">
                <h3>Loyalty Program Rules</h3>
                <p>Collect 6 stamps within 40 days to unlock your FREE Veg Maggi. If the cycle is not completed within 40 days, the stamp count resets automatically.</p>
            </div>
        </div>

        <!-- HISTORY SECTION -->
        <section class="history-section">
            <div class="section-title">
                <h2>Activity Log</h2>
            </div>

            <!-- LOADING STATE -->
            <div id="historyLoading" class="history-loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading your history...</p>
            </div>

            <!-- EMPTY STATE -->
            <div id="historyEmpty" class="history-empty" style="display: none;">
                <i class="fa-solid fa-box-open"></i>
                <p>No activity recorded yet.</p>
            </div>

            <!-- HISTORY CONTAINER (WITH ARIA-LIVE) -->
            <div id="historyContainer" class="history-container" style="display: none;" aria-live="polite">
                <!-- Dynamic Items from history.js will render here -->
            </div>
        </section>

        <!-- BOTTOM NAV SPACE -->
        <div class="navigation-space"></div>
    </main>

    <!-- Firebase & Custom JS Module -->
    <script type="module" src="js/history.js"></script>
</body>
</html>
