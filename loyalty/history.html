<!-- =====================================
     SERVICE WORKER
===================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(

        "load",

        async () => {

            try {

                const registration =
                    await navigator.serviceWorker.register(
                        "./service-worker.js"
                    );


                console.log(

                    "Rio Maggi Point Service Worker Registered:",

                    registration.scope

                );

            }

            catch (error) {

                console.error(

                    "Service Worker Registration Failed:",

                    error

                );

            }

        }

    );

}

</script>
