<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

My QR | Rio Maggi Point

</title>

<!-- PWA -->

<link
rel="manifest"
href="manifest.json">

<meta
name="theme-color"
content="#111111">

<link
rel="icon"
href="favicon.ico">

<link
rel="stylesheet"
href="css/qr.css">

</head>

<body>

<div class="page">

<!-- ===================================== -->
<!-- PREMIUM QR CARD -->
<!-- ===================================== -->

<div
class="qr-card theme-male"
id="qrCard">

<!-- HEADER -->

<div class="qr-header">

<div class="brand">

<span class="rio">

Rio

</span>

<span class="bowl">

🍜

</span>

</div>

<div class="brand-title">

MAGGI POINT

</div>

<div class="brand-sub">

Premium Loyalty Member

</div>

</div>

<!-- PROFILE -->

<div class="profile-section">

<div class="avatar-box">

<img

id="customerPhoto"

src="assets/avatars/male.png"

alt="Avatar">

</div>

<div
class="customer-name"
id="customerName">

Customer

</div>

<div
class="member-id"
id="memberId">

ID : -----

</div>

</div>

<!-- QR AREA -->

<div class="qr-wrapper">

<div
id="qrcode">

</div>

<div class="scan-text">

SHOW THIS QR TO RIO MAGGI POINT

</div>

</div>
        <!-- INFO -->

        <div class="info-box">

            <div class="info-title">

                Secure QR

            </div>

            <div class="info-text">

                Scan this QR at Rio Maggi Point
                to receive your loyalty stamp.

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="button-row">

            <button
            id="downloadQR"
            class="primary-btn">

                Download

            </button>

            <button
            id="shareQR"
            class="primary-btn">

                Share

            </button>

        </div>

    </div>

    <!-- ============================= -->
    <!-- BOTTOM NAVIGATION -->
    <!-- ============================= -->

    <nav class="bottom-nav">

        <a href="card.html">

            <img
            src="assets/icons/home.png"
            alt="Home">

            <span>Home</span>

        </a>

        <a href="qr.html">

            <img
            src="assets/icons/qr.png"
            alt="QR">

            <span>QR</span>

        </a>

        <a href="history.html">

            <img
            src="assets/icons/history.png"
            alt="History">

            <span>History</span>

        </a>

        <a href="feedback.html">

            <img
            src="assets/icons/review.png"
            alt="Review">

            <span>Review</span>

        </a>

        <a href="profile.html">

            <img
            src="assets/icons/profile.png"
            alt="Profile">

            <span>Profile</span>

        </a>

    </nav>

</div>

<!-- QR Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- JS -->

<script
type="module"
src="js/qr.js"></script>

</body>

</html>
