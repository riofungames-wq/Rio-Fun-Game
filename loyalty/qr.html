<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Rio Maggi Point • QR Code
</title>

<meta
name="theme-color"
content="#111111">

<link
rel="manifest"
href="manifest.json">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
rel="stylesheet"
href="css/common.css">

<link
rel="stylesheet"
href="css/qr.css">

</head>

<body>

<div class="page">

<div class="qr-card app-card">

<div class="card-glow"></div>

<div class="card-shine"></div>

<header class="qr-header">

<h1>

RIO MAGGI POINT

</h1>

<p>

Premium Loyalty QR

</p>

</header>

<section class="customer-section">

<div class="avatar-frame">

<img
id="customerPhoto"
src="assets/avatars/male.png"
alt="Customer">

</div>

<div
class="customer-name"
id="customerName">

Loading...

</div>

<div class="customer-id">

ID :

<span id="memberId">

RIO-000000

</span>

</div>

</section>

<section class="qr-section">

<div class="section-title">

SCAN THIS QR AT COUNTER

</div>

<div
class="qr-box"
id="qrcode">

</div>

<div
class="qr-status"
id="qrStatus">

Preparing QR...

</div>

</section>

<section class="qr-action-box">

<button
class="action-btn"
id="downloadQR">

<i class="fa-solid fa-download"></i>

Download QR

</button>

<button
class="action-btn secondary"
id="shareQR">

<i class="fa-solid fa-share-nodes"></i>

Share QR

</button>

</section>
<section class="qr-info">

<div class="info-card">

<div class="info-icon">

<i class="fa-solid fa-circle-info"></i>

</div>

<div class="info-text">

<h3>

How To Use

</h3>

<p>

Show this QR code at the Rio Maggi Point counter whenever you purchase Maggi to receive your loyalty stamp.

</p>

</div>

</div>

</section>

<div class="nav-space"></div>

<nav class="bottom-nav">

<i class="fa-solid fa-house"></i>

<span>

<span>

<a href="history.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<i class="fa-solid fa-utensils"></i>

<span>

Menu

<a href="feedback.html">

<i class="fa-solid fa-heart"></i>

<span>

Review

</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script
type="module"
src="js/qr.js">
</script>

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("./service-worker.js");

});

}

</script>
